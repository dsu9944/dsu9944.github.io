<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>Alexia's Daily Lesson</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%85%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#1f2937;--gold:#f59e0b;--green:#16a34a;--green2:#22c55e;--red:#e11d48}
body.alexia{--main:#7c3aed;--main2:#8b5cf6;--soft:#ede9fe;--soft2:#faf5ff;--line:#ddd6fe;--shadow:#5b21b6;--bar:linear-gradient(90deg,#7c3aed,#ec4899);--bg:linear-gradient(160deg,#fdf2ff,#e0f2fe)}
body.ethan{--main:#2563eb;--main2:#3b82f6;--soft:#dbeafe;--soft2:#eff6ff;--line:#bfdbfe;--shadow:#1e40af;--bar:linear-gradient(90deg,#2563eb,#16a34a);--bg:linear-gradient(160deg,#ecfeff,#eff6ff 50%,#f0fdf4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;font-size:18px}
button{font-family:inherit;font-size:1rem;cursor:pointer;border:none;border-radius:16px;padding:12px 18px;min-height:48px;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:4px solid #fbbf24;outline-offset:2px}
.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bar);color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.topbar h1{font-size:1.2rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.pill{background:rgba(255,255,255,.22);border-radius:999px;padding:6px 12px;font-weight:bold;white-space:nowrap}
.iconbtn{background:rgba(255,255,255,.22);color:#fff;min-height:40px;padding:6px 12px;border-radius:999px;text-decoration:none;font-weight:bold;display:inline-flex;align-items:center;white-space:nowrap}
@media (max-width:560px){.topbar{gap:6px;padding:8px 10px}.topbar .lbl{display:none}.topbar .pill{padding:4px 8px}.topbar h1{font-size:1rem;min-width:0}}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:24px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.08);margin-bottom:16px}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero .big{font-size:3.2rem}
.hero h2{margin:0 0 4px;font-size:1.6rem;color:var(--main)}
.btn{background:var(--main);color:#fff;font-weight:bold;box-shadow:0 4px 0 var(--shadow)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--shadow)}
.btn.orange{background:#ff8a3d;box-shadow:0 4px 0 #c2410c}.btn.green{background:var(--green);box-shadow:0 4px 0 #166534}
.btn.ghost{background:var(--soft);color:var(--main);box-shadow:0 4px 0 var(--line)}
.btn.small{min-height:38px;padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.huge{font-size:1.4rem;padding:16px 30px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;background:var(--soft);color:var(--main);border-radius:999px;padding:3px 12px;font-size:.9rem;font-weight:bold}
.tag.new{background:#fef3c7;color:#92400e}.tag.ok{background:#dcfce7;color:#166534}.tag.school{background:#ffedd5;color:#9a3412}
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:12px 0}
.sec{background:var(--soft2);border:3px solid var(--line);border-radius:16px;padding:10px;font-size:.95rem;font-family:inherit;color:inherit;text-align:left;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-height:48px;box-shadow:0 3px 0 var(--line);transition:transform .08s,border-color .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.sec:hover{border-color:var(--main);transform:translateY(-2px);box-shadow:0 5px 0 var(--line)}
.sec:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.sec:focus-visible{outline:4px solid var(--main);outline-offset:2px}
.sec.full{background:#ecfdf5;border-color:#86efac}
.sec .secst{font-weight:800}
.sec .secgo{font-size:.8rem;font-weight:800;color:var(--main);margin-top:2px}
.sec b{display:block;color:var(--main);font-size:1.05rem}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center}
.wd{background:#f8fafc;border:3px solid #e5e7eb;border-radius:14px;padding:6px 2px;font-size:.85rem}
.wd .dn{font-weight:bold}.wd .st{font-size:1.5rem;line-height:1.4}
.wd.done{background:#dcfce7;border-color:#86efac}.wd.today{border-color:var(--main);box-shadow:0 0 0 3px var(--line)}.wd.fri{background:#fef9c3}
.wd.done.fri{background:#bbf7d0}
.focus{background:#fff7ed;border:3px solid #fb923c;border-radius:18px;padding:12px 14px;margin-bottom:16px}
details summary{cursor:pointer;font-weight:bold;color:var(--main);min-height:40px;display:flex;align-items:center}
.path{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.path li{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#f8fafc;border-radius:12px;padding:6px 10px;font-size:.92rem}
.path li.cur{background:#fef3c7;border:2px solid #f59e0b}.path li.done{background:#f0fdf4}
.path .code{color:#6b7280;font-size:.8rem}
.small{font-size:.88rem;color:#4b5563}
/* play */
.playhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.playhead .secname{font-weight:bold;color:var(--main);font-size:1.15rem;flex:1}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin-bottom:12px;font-size:.9rem;font-weight:bold}
.pbar{height:16px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.pbar>div{height:100%;background:var(--main2);border-radius:999px;transition:width .3s}
.pbar.time>div{background:linear-gradient(90deg,#22c55e,#facc15)}
.pbar.time.over>div{background:#fb923c}
.timesup{background:#fff7ed;border:3px solid #fb923c;border-radius:14px;padding:8px 12px;margin-bottom:10px;text-align:center;font-weight:bold}
.prompt{font-size:1.3rem;line-height:1.6;margin-bottom:12px;text-align:center}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;min-height:80px}
.vis{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
svg{display:block;max-width:100%}
svg.bar{width:100%;max-width:640px;height:auto}
svg.nl{width:100%;max-width:760px;height:auto}
svg.pizza{width:min(42vw,200px);height:auto}
svg.graph{height:auto;width:100%}
svg.shape{height:auto;width:auto;max-width:100%}
svg.jl{width:100%;height:auto}
.gtitle{font-weight:bold;text-align:center;color:#374151}
.gwrap{max-width:420px;width:100%}
.controls{display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.hint{margin-top:12px;background:#fffbeb;border:3px dashed #fbbf24;border-radius:16px;padding:12px;text-align:center;font-size:1.1rem}
.hint .guided{display:block;font-size:.85rem;color:#92400e;font-weight:bold}
.hint .h1{display:inline-block;text-align:left;vertical-align:top}
.hint .more{margin-top:8px}
.hint .more .btn{font-size:.95rem;padding:6px 14px}
.hint .hint2{margin-top:10px;padding-top:8px;border-top:2px dotted #fbbf24;text-align:left;display:inline-block}
.feedback{margin-top:14px;border-radius:20px;padding:14px;text-align:center;font-size:1.1rem;animation:pop .25s ease-out}
.feedback.good{background:#dcfce7;border:3px solid var(--green2)}
.feedback.bad{background:#fff1f2;border:3px solid #fda4af}
.fbtitle{font-size:1.45rem;font-weight:bold;margin-bottom:6px}
.expl{margin:10px auto;max-width:720px;line-height:1.7;display:flex;flex-direction:column;align-items:center;gap:6px}
.tellbox{background:#eff6ff;border:3px solid #60a5fa;border-radius:16px;padding:10px 12px;margin:10px auto;max-width:640px}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:680px}
.opt{background:#fff;border:4px solid var(--line);font-size:1.6rem;padding:12px 6px;min-height:84px;color:var(--ink)}
.opt:hover{border-color:var(--main2)}
.opt.right{background:#dcfce7;border-color:var(--green2)}.opt.wrong{background:#ffe4e6;border-color:var(--red)}
.opts.txt .opt{font-size:1.15rem;min-height:64px}
.opts.opts3{grid-template-columns:repeat(3,1fr);max-width:600px}
.opts.opts3 .opt small{display:block;font-size:.85rem;color:#4b5563;font-weight:normal}
.opts.pics{grid-template-columns:repeat(3,1fr)}.opts.pics .opt{padding:10px}
@media (max-width:560px){.opts{grid-template-columns:repeat(2,1fr)}.opts.pics{grid-template-columns:1fr}.opt{font-size:1.3rem}}
.entryrow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-size:2.2rem;font-weight:bold}
.entryrow small{font-size:1rem;color:#6b7280}
.op{font-size:2.2rem;font-weight:bold}
.ebox{display:inline-block;min-width:1.6em;min-height:1.15em;border:3px dashed var(--main2);border-radius:10px;color:var(--main);background:var(--soft2);text-align:center;cursor:pointer;line-height:1.1;margin:2px 0;padding:0 .15em}
.ebox.active{border-style:solid;border-color:var(--main);background:var(--soft);box-shadow:0 0 0 4px var(--line)}
.ebox.okb{border-color:var(--green);color:var(--green)}.ebox.badb{border-color:var(--red);color:var(--red)}
.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:420px;width:100%}
.keypad button{background:var(--soft);color:var(--main);font-size:1.5rem;font-weight:bold;min-height:56px;box-shadow:0 3px 0 var(--line)}
.keypad button.wide{grid-column:span 2;font-size:1.05rem}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .15em;font-weight:bold}
.frac .num{border-bottom:3px solid currentColor;padding:0 .2em}.frac .den{padding:0 .2em}
.frac.big{font-size:1.5em}.frac.huge,.mixed.huge{font-size:1.15em}
.mixed{display:inline-flex;align-items:center;font-weight:bold}.mixed .wn{font-size:1.25em;margin-right:.08em}
.dec{font-weight:bold;white-space:nowrap}.dec.big{font-size:1.4em}.dec.huge{font-size:2.6em}
.bigq{font-size:2rem;font-weight:bold;text-align:center;margin:6px 0}
.cmp{display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;font-size:1.6rem}
.cmp .qm{font-size:2.2rem;font-weight:bold;color:var(--main2);border:4px dashed var(--line);border-radius:50%;width:66px;height:66px;display:flex;align-items:center;justify-content:center}
.story{display:block;font-size:1.2rem;line-height:1.6;background:var(--soft2);border-radius:18px;padding:12px 16px;max-width:720px;margin:0 auto;text-align:left}
.grids{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
table.pv{border-collapse:collapse;margin:8px auto;font-size:1.3rem}
table.pv th{font-size:.8rem;color:#6b7280;padding:2px 10px;font-weight:normal}
table.pv td{border:3px solid var(--line);min-width:48px;text-align:center;font-weight:bold;padding:4px 8px;background:var(--soft2)}
table.pv td.pt{border:none;background:none;min-width:10px}
table.dtab{border-collapse:collapse;margin:6px auto;font-size:1.15rem}
table.dtab th,table.dtab td{border:2px solid #cbd5e1;padding:6px 14px;text-align:center}
table.dtab th{background:var(--soft)}
.colsum{font-size:1.3rem;font-weight:bold;border-collapse:collapse;margin:6px auto}.colsum td{padding:2px 8px;text-align:right}.colsum tr.tot td{border-top:3px solid #1f2937}
.groups{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.plate{background:#fef3c7;border:3px solid #f59e0b;border-radius:50%;min-width:84px;min-height:84px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px;font-size:1.3rem;max-width:120px}
.pict{display:flex;flex-direction:column;gap:6px;font-size:1.6rem;background:#f8fafc;border-radius:14px;padding:10px 14px}
.pict .lab{display:inline-block;width:130px;font-size:1rem;font-weight:bold}.pict .key{font-size:1rem}
.compass{font-size:1.5rem;font-weight:bold;text-align:center;line-height:1.5;background:#f8fafc;border-radius:50%;width:120px;height:120px;display:flex;align-items:center;justify-content:center}
.tentry b{margin:0 .1em}
.example{background:#f0fdf4;border:3px solid #86efac;border-radius:18px;padding:12px 16px;max-width:760px;margin:0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.example h3{margin:0;color:#166534}
/* results */
.results{text-align:center}
.results .stars{font-size:3.4rem;color:var(--gold);letter-spacing:6px}
.results h2{color:var(--main);font-size:1.8rem;margin:8px 0}
table.sum{border-collapse:collapse;margin:10px auto;font-size:1rem;min-width:min(100%,460px)}
table.sum th,table.sum td{border-bottom:2px solid #e5e7eb;padding:6px 10px;text-align:left}
.acc{display:inline-block;height:12px;border-radius:6px;background:var(--green2);vertical-align:middle}
.msg{border-radius:14px;padding:8px 12px;margin:8px auto;max-width:640px}
.msg.up{background:#ecfdf5;color:#065f46}.msg.next{background:#fef3c7;color:#92400e}
.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.say{background:var(--soft);color:var(--main);min-height:40px;padding:4px 12px;border-radius:999px;font-size:1rem;vertical-align:middle;margin-left:6px}
#prompt.bigp{font-size:2.2rem;font-weight:bold}
a.btn{display:inline-flex;align-items:center;text-decoration:none;padding:12px 18px;border-radius:16px;min-height:48px}
.tag.redo{background:#fff7ed;color:#c2410c;border:2px solid #fdba74}
.redonote{margin:6px 0;font-weight:700;color:#9a3412}
.fixedline{display:inline-block;background:#ecfdf5;color:#065f46;border-radius:12px;padding:8px 14px;font-weight:700;margin:4px 0}
.rv{text-align:left}.rvhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}.rvhead b{color:var(--main);font-size:1.1rem}
.rvprompt{justify-content:flex-start}.rvans{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.chip{border-radius:12px;padding:8px 12px;font-weight:700;line-height:1.5}.chip.bad{background:#fef2f2;color:#991b1b;border:2px solid #fecaca}.chip.ok{background:#ecfdf5;color:#065f46;border:2px solid #a7f3d0}
.chip svg{max-height:110px;width:auto;vertical-align:middle}.rvst{font-weight:700;color:#9a3412}
.rvexp{background:var(--soft2);border:3px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0}.rvexp ol.steps{margin:6px 0 4px;padding-left:22px}.rvexp li{margin:3px 0}
.rvtry{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}.rvplay{flex-basis:100%}.rvmini{border:3px dashed var(--line);border-radius:14px;padding:10px;margin-top:6px}
.rvctl{gap:10px;align-items:center;flex-wrap:wrap}.rvctl select{font:inherit;font-size:1rem;padding:8px 10px;border-radius:12px;border:3px solid var(--line);background:#fff;min-height:44px;max-width:100%}
.seg{display:flex;gap:6px}.rvnav{justify-content:space-between;align-items:center;margin:8px 0 20px}.rvnone{text-align:center;font-size:1.1rem}
.rvfb{margin-top:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.rvprompt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rvvar{background:#fff;border-radius:10px;padding:6px 10px;margin:4px 0;font-weight:600}
.rvvar .story,.chip .story{display:inline;background:none;padding:0;margin:0;font-size:inherit}.rvmini{text-align:center}.rvmini .keypad{margin:8px auto}.rvmini .opts{margin:8px auto}
.seg .btn:not(.ghost){color:#fff}

</style>
</head>
<body class="alexia">
<header class="topbar">
  <h1 id="homeLink" title="Today's lesson">📅 <span id="titleName">Alexia</span>'s Daily Lesson</h1>
  <span class="pill" id="ptsPill" title="Points">⭐ 0</span>
  <span class="pill" id="streakPill" title="Days in a row">🔥 0</span>
  <button class="iconbtn" id="soundBtn" aria-label="Sound on or off">🔊</button>
  <a class="iconbtn" id="gamesBtn" href="../../index.html" title="My games">🏠<span class="lbl"> Games</span></a>
  <a class="iconbtn" id="switchBtn" href="../../index.html?switch=1" title="Switch player">👥<span class="lbl"> Switch</span></a>
</header>
<main>
<section id="home"><div id="homeBody"></div></section>
<section id="play" class="hidden">
  <div class="playhead"><button class="btn ghost" id="quitBtn">⏸️ Pause</button><div class="secname" id="secName"></div></div>
  <div class="bars"><span>✏️ Questions</span><div class="pbar" id="progBar"><div style="width:0"></div></div><span id="progTxt"></span>
    <span>⏱️ Time</span><div class="pbar time" id="timeBar"><div style="width:0"></div></div><span id="timeTxt"></span></div>
  <div class="timesup hidden" id="timesUp">⏰ 15 minutes are up! Great effort. You can finish the last questions, or pause and come back later.</div>
  <div class="card">
    <div class="prompt"><span id="prompt"></span><button class="say" id="sayBtn" aria-label="Read the question aloud">🔈</button></div>
    <div class="vis" id="qvis"></div>
    <div class="stage" id="stage"></div>
    <div class="controls" id="controls"><button class="btn ghost" id="hintBtn">💡 Hint</button><button class="btn green" id="checkBtn">Check ✓</button></div>
    <div class="hint hidden" id="hintBox"></div>
    <div class="feedback hidden" id="feedback"></div>
  </div>
</section>
<section id="results" class="hidden"><div class="card results" id="resultsCard"></div></section>
<section id="review" class="hidden"><div id="reviewBody"></div></section>
</main>
<!-- "From school today" entries and extra topic modules live in focus.js (see README.md). -->
<script src="focus.js"></script>
<script>
(function(){
'use strict';
/* ===== shared helpers and pictures (copied/adapted from the existing games) ===== */
const OR='#ff8a3d',BL='#3b82f6',GRN='#15803d',RED='#e11d48',PU='#8b5cf6',YEL='#facc15';
const PAL=['#3b82f6','#f97316','#22c55e','#ec4899','#8b5cf6','#facc15','#14b8a6'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const range=n=>[...Array(n).keys()];
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const lcm=(a,b)=>a/gcd(a,b)*b;
const F=(n,d,cls='')=>`<span class="frac ${cls}"><span class="num">${n}</span><span class="den">${d}</span></span>`;
const M=(w,n,d,cls='')=>`<span class="mixed ${cls}"><span class="wn">${w}</span>${F(n,d)}</span>`;
/* decimals as whole numbers of hundredths (Decimal Zoom) */
const plc=v=>v%100===0?0:v%10===0?1:2;
const D=(v,pl)=>{const w=Math.floor(v/100),r=v%100;if(pl==null)pl=plc(v);if(pl===0)return String(w);if(pl===1)return w+'.'+Math.floor(r/10);return w+'.'+String(r).padStart(2,'0');};
/* thousandths */
const D3=(vt,pl)=>{const w=Math.floor(vt/1000),r=vt%1000;if(pl==null)pl=r===0?0:r%100===0?1:r%10===0?2:3;if(pl===0)return String(w);return w+'.'+String(r).padStart(3,'0').slice(0,pl);};
const money=c=>'$'+Math.floor(c/100)+'.'+String(c%100).padStart(2,'0');
const DEC=(s,cls='big')=>`<span class="dec ${cls}">${s}</span>`;

function barSVG({parts=10,fills=[],w=600,h=60,labels=null}){
  const pw=w/parts;let s=`<svg class="bar" viewBox="-6 -8 ${w+12} ${h+16}" aria-label="bar cut into ${parts} parts">`;
  for(let i=0;i<parts;i++){s+=`<rect x="${i*pw}" y="0" width="${pw}" height="${h}" fill="${fills[i]||'#ffffff'}" stroke="#374151" stroke-width="2"/>`;
    if(labels&&labels[i]!=null)s+=`<text x="${i*pw+pw/2}" y="${h/2+8}" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">${labels[i]}</text>`;}
  return s+`<rect x="0" y="0" width="${w}" height="${h}" fill="none" stroke="#1f2937" stroke-width="4"/></svg>`;
}
const fillN=(n,col=OR)=>range(n).map(()=>col);
function grid100(v,{size=200,col=OR}={}){
  const c=size/10;let s=`<svg class="g100" viewBox="-3 -3 ${size+6} ${size+6}" width="${size}" aria-label="hundred grid with ${v} squares shaded">`;

  let a,b,c,d;for(let t=0;t<50;t++){b=rnd(2,l>=2?10:6);d=l>=2?rnd(2,10):b*rnd(2,3);a=rnd(1,b-1);c=rnd(1,d-1);if(b!==d&&(chance(0.2)||a*d!==c*b))break;}

 example(){return {html:`${big(`${F(3,4,'huge')} = ${F(6,8,'huge')}`)}${barSVG({parts:4,fills:fillN(3)})}${barSVG({parts:8,fills:fillN(6,BL)})}<p>Multiply the top <b>and</b> the bottom by the same number (here × 2). The shaded part stays the same size.</p>`};}},

{id:'addfrac',title:'Adding & Subtracting Fractions',icon:'➕',code:'MA3-RQF-02',game:'addfractions',blurb:'Same denominators, mixed numbers, then related denominators (Year 5).',

      if(s>d&&s%d){const w=Math.floor(s/d),n=s%d;return Object.assign({sub,prompt:`${F(a,d,'big')} + ${F(b,d,'big')} = ? Write it as a mixed number.`,hint:steps(`The pieces are ${fw(d)}, so add the tops: ${a} + ${b}.`,`${d} ${fw(d)} make 1 whole. Take out the whole; what is left stays as ${fw(d)}.`),

      return Object.assign({sub,prompt:`${M(w,a,d,'big')} − ${F(b,d,'big')} = ?`,hint:steps(`${F(b,d)} is more than ${F(a,d)}, so break one whole into ${d} ${fw(d)}.`,`${M(w,a,d)} = ${M(w-1,a+d,d)}. Now take ${b} from ${a+d}.`),

        explain:`${M(w,a,d)} = ${M(w-1,a+d,d)}. Then ${a+d} − ${b} = ${a+d-b}, so the answer is <b>${M(W,n,d)}</b>.`},n?mixedE(W,n,d,{den:true}):num(W));}
    const a=rnd(2,d-1),b=rnd(1,a-1);return Object.assign({sub,prompt:`${F(a,d,'big')} − ${F(b,d,'big')} = ?`,hint:steps(`The pieces are ${fw(d)}, so the bottom stays ${d}.`,`Take away the tops: ${a} − ${b}.`),hint2:steps(`Draw a number line from 0 to 1 cut into ${d} equal parts. Start at ${F(a,d)}.`,`Jump back ${b} part${b>1?'s':''}. Where do you land?`),explain:`${a} − ${b} = ${a-b}, so the answer is <b>${F(a-b,d)}</b>.`+barSVG({parts:d,fills:fillN(a-b).concat(fillN(b,'#fda4af'))})},fracE(a-b,d,{den:true}));}
  if(sub==='related'){const b=pick([2,3,4,5]),k=pick(b<=3?[2,3,4]:[2]),D2=b*k;let a=rnd(1,b-1),c=rnd(1,D2-1);if(l<3)while(a*k+c>=D2&&c>1)c--;
    const s=a*k+c;const res=s>D2&&l>=3&&s%D2?mixedE(Math.floor(s/D2),s%D2,D2,{den:true}):fracE(s,D2,{den:true});
    return Object.assign({sub,prompt:`${F(a,b,'big')} + ${F(c,D2,'big')} = ?`,hint:steps(`${b} goes into ${D2}, so change ${F(a,b)} into ${fw(D2)}: × ${k} top and bottom.`,`Then add the tops. The bottom stays ${D2}.`),
      hint2:steps(`Parallel number lines from 0 to 1: one in ${fw(b)}, one in ${fw(D2)}. Each ${b===2?'half':fw(b).slice(0,-1)} lines up with ${k} ${fw(D2)}.`,`So ${F(a,b)} lines up with ${a} × ${k} ${fw(D2)}.`,`Add ${c} more ${fw(D2)}${l>=3?`. If the top ends up bigger than ${D2}, take out a whole`:''}.`),
      explain:`${F(a,b)} = ${F(a*k,D2)}. Then ${F(a*k,D2)} + ${F(c,D2)} = <b>${F(s,D2)}</b>${s>D2&&s%D2?` = ${M(Math.floor(s/D2),s%D2,D2)}`:''}.`+barSVG({parts:b,fills:fillN(a)})+barSVG({parts:D2,fills:fillN(a*k).concat(fillN(c,BL))})},res);}
  const d=pick([6,8,10,12]),a=rnd(1,d/2-1),b=rnd(1,d/2-1),who=pick(['Mia','Zoe','Ruby']);

    hint:steps(`The pizza has ${d} slices, so each slice is ${F(1,d)}.`,`Add the slices they ate: ${a} + ${b}.`),hint2:steps(`Write it as ${F(a,d)} + ${F(b,d)}.`,`Add only the tops. The bottom stays ${d}: the slices are still ${fw(d)}.`),explain:`${a} + ${b} = ${a+b} slices out of ${d}: <b>${F(a+b,d)}</b>.`+pizzaSVG({parts:d,shaded:a+b,r:70})},fracE(a+b,d,{den:true}));},

{id:'decline',title:'Decimals on a Number Line',icon:'📍',code:'MA2-RN-02',game:'decimals',blurb:'Tenths and hundredths on number lines, comparing and ordering.',
 subs:l=>['read','compare','order'],
 gen(H,l,sub){
  if(sub==='read'){let line,ans,hint,hint2;
    if(l===0){const n=rnd(1,9);line={lo:0,hi:100,step:10,lab:'ends',marks:[{v:n*10}]};ans=D(n*10);hint=steps('There are 10 equal jumps from 0 to 1, so each jump is one tenth.','Count the jumps from 0 to the dot.');hint2=steps('Point at each mark as you count: 1 tenth, 2 tenths, 3 tenths …','The number of tenths is the digit after the point.');}
    else if(l===1){const W=rnd(1,4)*100;const v=W+rnd(1,9)*10;line={lo:W,hi:W+100,step:10,lab:'ends',marks:[{v}]};ans=D(v);hint=steps(`The line goes from ${D(W)} to ${D(W+100)} in 10 jumps, so each jump is one tenth.`,`Start at ${D(W)} and count the jumps to the dot.`);hint2=steps(`The whole number part stays ${D(W)}.`,'The number of jumps is the tenths digit, after the point.');}
    else{const lo=rnd(0,29)*10,v=lo+rnd(1,9);line={lo,hi:lo+10,step:1,lab:'ends',marks:[{v}]};ans=D(v,2);hint=steps(`From ${D(lo,1)} to ${D(lo+10,1)} there are 10 small jumps, so each is one hundredth.`,`Start at ${D(lo,1)} and count the small jumps to the dot.`);hint2=steps(`Write ${D(lo,1)} with two places: ${D(lo,2)}.`,'The number of small jumps is the hundredths digit (the 2nd place after the point).');}
    return Object.assign({sub,prompt:'What decimal is the orange dot on?',vis:dl({lines:[line]}),hint,hint2,explain:`The dot is on <b>${ans}</b>.`+dl({lines:[Object.assign({},line,{lab:'all',highlight:line.marks[0].v})]})},decE(ans));}
  if(sub==='compare'){let a,b;if(chance(0.5)){const x=rnd(2,9);a=x*10;b=(x-1)*10+rnd(1,9);}else{a=rnd(11,99);do{b=rnd(11,99);}while(b===a);}
    if(l>=2){a+=100*rnd(0,2);b+=100*rnd(0,2);}const s=chance(0.5)?[a,b]:[b,a];const k=cmpK(s[0],s[1]);
    return Object.assign({sub,prompt:'Which sign goes in the circle?',vis:`<div class="cmp">${DEC(D(s[0]),'huge')}<span class="qm">?</span>${DEC(D(s[1]),'huge')}</div>`,hint:steps(`Give both two decimal places: ${D(s[0],2)} and ${D(s[1],2)}.`,'Compare the ones first, then the tenths, then the hundredths.'),
      hint2:steps(`Think of them as hundredths: ${s[0]} hundredths and ${s[1]} hundredths.`,'Which is more? More digits does not always mean bigger!'),
      explain:`${D(s[0],2)} ${SIGNS[k]} ${D(s[1],2)}. More digits doesn't mean bigger! Compare ones, then tenths, then hundredths.`},signOpts(k));}
  const vals=new Set();while(vals.size<4){let v=chance(0.5)?rnd(1,9)*10:rnd(1,99);if(l>=1&&chance(0.3))v+=100;vals.add(v);}const V=[...vals];const big_=chance(0.5);const ans=big_?Math.max(...V):Math.min(...V);
  return Object.assign({sub,prompt:`Which decimal is the <b>${big_?'largest':'smallest'}</b>?`,hint:steps('Give them all two decimal places.','Compare the ones, then the tenths, then the hundredths.'),hint2:steps(`With two places they are ${V.map(v=>D(v,2)).join(', ')}.`,`Now find the ${big_?'largest':'smallest'}, like comparing whole numbers of hundredths.`),explain:`With two places: ${V.map(v=>D(v,2)).join(', ')}. The ${big_?'largest':'smallest'} is <b>${D(ans)}</b>.`},opts(D(ans),V.filter(v=>v!==ans).map(v=>D(v))));},
 example(){return {html:`${dl({lines:[{lo:0,hi:100,step:10,lab:'all',marks:[{v:70}]}]})}<p>From 0 to 1 there are 10 equal jumps, so each jump is <b>0.1</b>. The dot is 7 jumps along: <b>0.7</b>.</p>`};}},

{id:'thou',title:'Decimals to Thousandths',icon:'🔬',code:'MA3-RN-02',game:'decimals',blurb:'Three decimal places: read, compare, order and round.',
 subs:l=>l>=2?['frac','digit','compare','order','round']:['frac','digit','compare','order'],
 gen(H,l,sub){
  const w=l>=2?rnd(0,9):0;
  if(sub==='frac'){const r=pick([rnd(1,9),rnd(11,99),rnd(101,999)]),vt=w*1000+r;const sf=w?M(w,r,1000,'big'):F(r,1000,'big');
    return Object.assign({sub,prompt:`Write ${sf} as a decimal.`,hint:steps(w?`Write the whole number ${w}, then the point.`:'There are no wholes, so start with 0 and the point.',`Thousandths need <b>three</b> places after the point.${r<100?' Use zeros to hold the empty places.':''}`),
      hint2:steps('Draw a place value table: tenths | hundredths | thousandths.',`${r} thousandths must end in the thousandths column. Fill the columns from the right${r<100?', then put 0 in any empty column':''}.`),explain:`${F(r,1000)} = ${D3(r,3)}, so the answer is <b>${D3(vt,3)}</b>.`},decE(D3(vt,3)));}
  if(sub==='digit'){let vt,s,idx;for(let t=0;t<50;t++){vt=w*1000+rnd(101,999);s=D3(vt,3).replace('.','');idx=rnd(1,3);if(s[idx]!=='0'&&s.split('').filter(c=>c===s[idx]).length===1)break;}
    const dg=+s[idx],PL=['ones','tenths','hundredths','thousandths'];
    const vals=[dg+'',D3(dg*100,1),D3(dg*10,2),D3(dg,3)];const ex=dg===3?4:3;
    return Object.assign({sub,prompt:`What is the value of the digit <b>${dg}</b> in ${DEC(D3(vt,3))}?`,hint:steps(`Find the ${dg} in ${D3(vt,3)}. How many places after the point is it?`,'1st place = tenths, 2nd = hundredths, 3rd = thousandths.'),hint2:steps(`Put ${D3(vt,3)} in a place value table: ones . tenths hundredths thousandths.`,`A digit's value is the digit × its place. For example, a ${ex} in the hundredths place is worth ${D3(ex*10,2)}.`),explain:`The ${dg} is in the <b>${PL[idx]}</b> place, so it is worth <b>${vals[idx]}</b>.`},opts(vals[idx],vals.filter((_,i)=>i!==idx),{cls:'txt'}));}
  if(sub==='compare'){let a,b;const k0=pick(['trap','trap','equal','plain']);
    if(k0==='trap'){const t=rnd(2,9);a=t*100;b=(t-1)*100+rnd(10,99);if(b%10===0)b++;}else if(k0==='equal'){a=rnd(1,9)*100+rnd(1,9)*10;b=a;}else{a=rnd(101,999);do{b=rnd(101,999);}while(b===a);}
    a+=w*1000;b+=w*1000;const s=chance(0.5)?[[a,k0==='equal'?2:null],[b,k0==='equal'?3:null]]:[[b,k0==='equal'?3:null],[a,k0==='equal'?2:null]];const k=cmpK(s[0][0],s[1][0]);
    return Object.assign({sub,prompt:'Which sign goes in the circle?',vis:`<div class="cmp">${DEC(D3(s[0][0],s[0][1]),'huge')}<span class="qm">?</span>${DEC(D3(s[1][0],s[1][1]),'huge')}</div>`,hint:steps(`Give them both three places: ${D3(s[0][0],3)} and ${D3(s[1][0],3)}.`,'Compare from left to right: ones, tenths, hundredths, thousandths.'),
      hint2:steps(`Think of them as thousandths: ${s[0][0]} thousandths and ${s[1][0]} thousandths.`,'Which number of thousandths is bigger? Or are they the same?'),
      explain:`${D3(s[0][0],3)} ${SIGNS[k]} ${D3(s[1][0],3)}. Compare the places from left to right. More digits doesn't mean bigger!`},signOpts(k));}
  if(sub==='order'){const set=new Set();const t=rnd(1,8);while(set.size<4){const kind=rnd(0,2);set.add(w*1000+(kind===0?t*100:kind===1?t*100+rnd(1,9)*10+rnd(0,9):(t+rnd(-1,1))*100+rnd(1,99)));}
    const V=[...set].filter(v=>v>0);const big_=chance(0.5),ans=big_?Math.max(...V):Math.min(...V);
    return Object.assign({sub,prompt:`Which is the <b>${big_?'largest':'smallest'}</b>?`,hint:steps('Give them all three decimal places.','Compare the tenths first, then the hundredths, then the thousandths.'),hint2:steps(`With three places: ${V.map(v=>D3(v,3)).join(', ')}.`,`Now find the ${big_?'largest':'smallest'}, like comparing whole numbers of thousandths.`),explain:`With three places: ${V.map(v=>D3(v,3)).join(', ')}. The ${big_?'largest':'smallest'} is <b>${D3(ans)}</b>.`},opts(D3(ans),V.filter(v=>v!==ans).map(v=>D3(v))));}
  const toT=chance(0.5);let vt;do{vt=w*1000+rnd(1,999);}while(vt%10===0||(toT&&vt%100===50)||(!toT&&vt%10===5));
  const unit=toT?100:10,lo=Math.floor(vt/unit)*unit,ans=vt-lo>=unit/2?lo+unit:lo;const pl=toT?1:2;
  return Object.assign({sub:'round',prompt:`Round ${DEC(D3(vt,3))} to the nearest <b>${toT?'tenth':'hundredth'}</b>.`,hint:steps(`Find the ${toT?'tenths':'hundredths'} digit, then look at the digit just after it.`,`5 or more: the ${toT?'tenths':'hundredths'} digit goes up by 1. 4 or less: it stays the same. Drop the digits after it.`),
    hint2:steps(`Underline the ${toT?'tenths':'hundredths'} digit in ${D3(vt,3)}.`,'Circle the next digit to the right. Is it 5 or more (round up), or 4 or less (stays the same)?',`Write the number with ${nPl(pl)} after the point.`),
    explain:`${D3(vt,3)} is between ${D3(lo,pl)} and ${D3(lo+unit,pl)}. It rounds to <b>${D3(ans,pl)}</b>.`},decE(D3(ans,pl)));},
 example(){return {html:`${big(`${F(47,1000,'huge')} = ${DEC('0.047','huge')}`)}<table class="pv"><tr><th>Ones</th><th></th><th>Tenths</th><th>Hundredths</th><th>Thousandths</th></tr><tr><td>0</td><td class="pt">.</td><td>0</td><td>4</td><td>7</td></tr></table><p>47 thousandths is less than one tenth, so the tenths place gets a <b>0</b>. Always use three places for thousandths.</p>`};}},

{id:'multdiv',title:'Multiplication & Division',icon:'✖️',code:'MA3-MR-01',blurb:'2-digit × 1-digit, division with remainders, factors and multiples.',
 subs:l=>['x21','x21','div','factors','multiples'],
 gen(H,l,sub){
  if(sub==='x21'){let a,b;if(l===0){a=rnd(12,49);b=rnd(2,6);}else if(l===1){a=rnd(23,99);b=rnd(3,9);}else if(l===2){a=rnd(112,499);b=rnd(3,9);}else{a=rnd(12,39);b=rnd(11,19);}

{id:'percent',title:'Percentages',icon:'💯',code:'MA3-RN-03',blurb:'Per cent means out of 100. Benchmarks and percentages of amounts.',

{id:'areaper',title:'Area & Perimeter',icon:'📐',code:'MA3-2DS-02 · MA3-GM-02',blurb:'Area in square units, perimeter, L-shapes and missing sides.',

  return Object.assign({sub,prompt:grid?'Each square is 1 cm long. What is the perimeter?':'What is the perimeter of this rectangle?',vis,hint:grid?steps('Perimeter is the distance all the way around.','Count along the top and down one side, then double it.'):steps('Perimeter is the distance all the way around.',`Add all 4 sides: ${w} + ${h} + ${w} + ${h}.`),

{id:'chance',title:'Chance & Probability',icon:'🎲',code:'MA3-CHAN-01',blurb:'Likely or unlikely, and probabilities as fractions.',

      box.innerHTML=`<div class="rvmini"><div class="small"><b>Your turn!</b> Pick an answer.</div><div class="opts ${Q.cls||''}">${p.map(i=>`<button class="opt" data-ro="${i}">${Q.choices[i]}</button>`).join('')}</div><div class="rvfb" aria-live="polite"></div></div>`;
      box.querySelectorAll('[data-ro]').forEach(b=>b.onclick=()=>{if(done)return;done=true;const i=+b.dataset.ro,ok=i===Q.answer;
        box.querySelectorAll('[data-ro]').forEach(x=>{if(+x.dataset.ro===Q.answer)x.classList.add('right');else if(x===b)x.classList.add('wrong');});fbk(ok);});}
    else{Q.fields.forEach(x=>f[x.id]='');active=Q.fields[0].id;
      const lay=(Q.layoutPre||'')+Q.layout.replace(/\[\[(\w+)\]\]/g,(m,id)=>`<span class="ebox" data-rf="${id}" role="button" tabindex="0" aria-label="answer box">&nbsp;</span>`);
      box.innerHTML=`<div class="rvmini"><div class="small"><b>Your turn!</b> Type the answer, then Check.</div><div class="entryrow">${lay}</div><div class="keypad">${[1,2,3,4,5,6,7,8,9,0].map(k=>`<button data-rk="${k}">${k}</button>`).join('')}${Q.dot?'<button data-rk=".">.</button>':''}<button data-rk="del" class="wide">⌫ Delete</button>${Q.fields.length>1?'<button data-rk="next" class="wide">Next box ➜</button>':''}</div><div class="row" style="justify-content:center"><button class="btn green" data-rcheck>Check ✓</button></div><div class="rvfb" aria-live="polite"></div></div>`;
      const ref=()=>{Q.fields.forEach(x=>{const el=box.querySelector(`[data-rf="${x.id}"]`);if(el){el.innerHTML=f[x.id]||'&nbsp;';el.classList.toggle('active',!done&&x.id===active);}});};ref();
      box.querySelectorAll('[data-rf]').forEach(el=>el.onclick=()=>{active=el.dataset.rf;ref();});
      box.querySelectorAll('[data-rk]').forEach(b=>b.onclick=()=>{if(done)return;const k=b.dataset.rk,i=Q.fields.findIndex(x=>x.id===active),fl=Q.fields[i];
        if(k==='next')active=Q.fields[(i+1)%Q.fields.length].id;else if(k==='del')f[active]=f[active].slice(0,-1);else if(k==='.'){if(Q.dot&&!f[active].includes('.'))f[active]+=f[active]?'.':'0.';}else if(f[active].length<fl.len)f[active]+=k;sfx('tap');ref();});
      box.querySelector('[data-rcheck]').onclick=()=>{if(done||!Q.fields.every(x=>f[x.id]!==''))return;done=true;const ok=Q.check?!!Q.check(f):Q.fields.every(x=>same(f[x.id],Q.answer[x.id]));
        Q.fields.forEach(x=>{const el=box.querySelector(`[data-rf="${x.id}"]`);if(el){el.classList.remove('active');el.classList.add(ok?'okb':'badb');}});box.querySelector('.keypad').remove();fbk(ok);};}};
  const fbk=ok=>{sfx(ok?'good':'bad');box.querySelector('.rvfb').innerHTML=(ok?`<div class="chip ok">🎉 Yes! That's it.</div>`:`<div class="chip bad">🤔 Not yet. The answer is ${e.c}. Look at the steps together.</div>`)+`<button class="btn ghost small" data-again>🔁 Try once more</button>`;
    box.querySelector('[data-again]').onclick=()=>{done=false;draw();};};
  draw();box.scrollIntoView({behavior:'smooth',block:'nearest'});}
/* ---------- events ---------- */
$('#homeLink').onclick=()=>{if(RUN&&!RUN.finished)save();home();};
$('#quitBtn').onclick=()=>{save();home();};
$('#soundBtn').onclick=()=>{S.sound=!S.sound;save();topbar();};
$('#sayBtn').onclick=()=>say(spoken($('#prompt')));
$('#hintBtn').onclick=()=>showHint(false);
$('#checkBtn').onclick=()=>{if(!q||q.done||q.kind==='choice')return;answer(gradeEntry());};
$('#stage').addEventListener('click',e=>{if(!q||q.done)return;const o=e.target.closest('[data-opt]');if(o&&q.kind==='choice'){q.chosen=+o.dataset.opt;answer(q.chosen===q.answer);return;}
  const k=e.target.closest('[data-key]');if(k){key(k.dataset.key);return;}const f=e.target.closest('[data-field]');if(f){q.active=f.dataset.field;refresh();}});
document.addEventListener('keydown',e=>{if(!q)return;if(q.done&&e.key==='Enter'){const n=$('#nextBtn');if(n){e.preventDefault();n.click();}return;}
  if(q.fields&&!q.done){if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==='.')key('.');else if(e.key==='Backspace')key('del');else if(e.key==='Tab'||e.key===':'||e.key==='/'){e.preventDefault();key('next');}else if(e.key==='Enter')$('#checkBtn').click();}});
window.addEventListener('pagehide',()=>{if(RUN)save();});
window.DAILY={get S(){return S;},get q(){return q;},get RUN(){return RUN;},get QS(){return QS;},TOPICS,PATH,STORE,TODAY,planLesson,makeQ,buildAll,home,answer:ok=>answer(ok),
  correctFill(){if(!q||q.example)return;if(q.kind==='choice'){q.chosen=q.answer;answer(true);return;}q.fields.forEach(f=>q.f[f.id]=String(q.answer[f.id]));refresh();answer(gradeEntry());},
  wrongFill(){if(!q||q.example)return;if(q.kind==='choice'){q.chosen=(q.answer+1)%q.choices.length;answer(false);return;}q.fields.forEach(f=>q.f[f.id]='999');answer(gradeEntry());},
  H,redoQ,pendingRedos,openReview,revList,revRecord,goSection,practiseSection,secProgress,setRNG:s=>{RNG=mulberry32(s);},gen:(id,l,sub)=>TOPICS[id].gen.call(TOPICS[id],H,l,sub),gradeEntry,same,activeFocus,weekFocus};
home();

})();
</script>
