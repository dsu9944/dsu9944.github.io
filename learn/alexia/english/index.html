<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>Alexia's English Revision</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#1f2937;--gold:#f59e0b;--green:#16a34a;--green2:#22c55e;--red:#e11d48}
body.alexia{--main:#7c3aed;--main2:#8b5cf6;--soft:#ede9fe;--soft2:#faf5ff;--line:#ddd6fe;--shadow:#5b21b6;--bar:linear-gradient(90deg,#7c3aed,#ec4899);--bg:linear-gradient(160deg,#fdf2ff,#e0f2fe)}
body.ethan{--main:#2563eb;--main2:#3b82f6;--soft:#dbeafe;--soft2:#eff6ff;--line:#bfdbfe;--shadow:#1e40af;--bar:linear-gradient(90deg,#2563eb,#16a34a);--bg:linear-gradient(160deg,#ecfeff,#eff6ff 50%,#f0fdf4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;font-size:18px}
button{font-family:inherit;font-size:1rem;cursor:pointer;border:none;border-radius:16px;padding:12px 18px;min-height:48px;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:4px solid #fbbf24;outline-offset:2px}
.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bar);color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.topbar h1{font-size:1.2rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.pill{background:rgba(255,255,255,.22);border-radius:999px;padding:6px 12px;font-weight:bold;white-space:nowrap}
.iconbtn{background:rgba(255,255,255,.22);color:#fff;min-height:40px;padding:6px 12px;border-radius:999px;text-decoration:none;font-weight:bold;display:inline-flex;align-items:center;white-space:nowrap}
@media (max-width:560px){.topbar{gap:6px;padding:8px 10px}.topbar .lbl{display:none}.topbar .pill{padding:4px 8px}.topbar h1{font-size:1rem;min-width:0}}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:24px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.08);margin-bottom:16px}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero .big{font-size:3.2rem}
.hero h2{margin:0 0 4px;font-size:1.6rem;color:var(--main)}
.btn{background:var(--main);color:#fff;font-weight:bold;box-shadow:0 4px 0 var(--shadow)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--shadow)}
.btn.orange{background:#ff8a3d;box-shadow:0 4px 0 #c2410c}.btn.green{background:var(--green);box-shadow:0 4px 0 #166534}
.btn.ghost{background:var(--soft);color:var(--main);box-shadow:0 4px 0 var(--line)}
.btn.small{min-height:38px;padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.huge{font-size:1.4rem;padding:16px 30px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;background:var(--soft);color:var(--main);border-radius:999px;padding:3px 12px;font-size:.9rem;font-weight:bold}
.tag.new{background:#fef3c7;color:#92400e}.tag.ok{background:#dcfce7;color:#166534}.tag.school{background:#ffedd5;color:#9a3412}
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:12px 0}
.sec{background:var(--soft2);border:3px solid var(--line);border-radius:16px;padding:10px;font-size:.95rem;font-family:inherit;color:inherit;text-align:left;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-height:48px;box-shadow:0 3px 0 var(--line);transition:transform .08s,border-color .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.sec:hover{border-color:var(--main);transform:translateY(-2px);box-shadow:0 5px 0 var(--line)}
.sec:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.sec:focus-visible{outline:4px solid var(--main);outline-offset:2px}
.sec.full{background:#ecfdf5;border-color:#86efac}
.sec .secst{font-weight:800}
.sec .secgo{font-size:.8rem;font-weight:800;color:var(--main);margin-top:2px}
.sec b{display:block;color:var(--main);font-size:1.05rem}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center}
.wd{background:#f8fafc;border:3px solid #e5e7eb;border-radius:14px;padding:6px 2px;font-size:.85rem}
.wd .dn{font-weight:bold}.wd .st{font-size:1.5rem;line-height:1.4}
.wd.done{background:#dcfce7;border-color:#86efac}.wd.today{border-color:var(--main);box-shadow:0 0 0 3px var(--line)}.wd.fri{background:#fef9c3}
.wd.done.fri{background:#bbf7d0}
.focus{background:#fff7ed;border:3px solid #fb923c;border-radius:18px;padding:12px 14px;margin-bottom:16px}
details summary{cursor:pointer;font-weight:bold;color:var(--main);min-height:40px;display:flex;align-items:center}
.path{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.path li{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#f8fafc;border-radius:12px;padding:6px 10px;font-size:.92rem}
.path li.cur{background:#fef3c7;border:2px solid #f59e0b}.path li.done{background:#f0fdf4}
.path .code{color:#6b7280;font-size:.8rem}
.small{font-size:.88rem;color:#4b5563}
/* play */
.playhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.playhead .secname{font-weight:bold;color:var(--main);font-size:1.15rem;flex:1}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin-bottom:12px;font-size:.9rem;font-weight:bold}
.pbar{height:16px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.pbar>div{height:100%;background:var(--main2);border-radius:999px;transition:width .3s}
.pbar.time>div{background:linear-gradient(90deg,#22c55e,#facc15)}
.pbar.time.over>div{background:#fb923c}
.timesup{background:#fff7ed;border:3px solid #fb923c;border-radius:14px;padding:8px 12px;margin-bottom:10px;text-align:center;font-weight:bold}
.prompt{font-size:1.3rem;line-height:1.6;margin-bottom:12px;text-align:center}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;min-height:80px}
.vis{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
svg{display:block;max-width:100%}
svg.bar{width:100%;max-width:640px;height:auto}
svg.nl{width:100%;max-width:760px;height:auto}
svg.pizza{width:min(42vw,200px);height:auto}
svg.graph{height:auto;width:100%}
svg.shape{height:auto;width:auto;max-width:100%}
svg.jl{width:100%;height:auto}
.gtitle{font-weight:bold;text-align:center;color:#374151}
.gwrap{max-width:420px;width:100%}
.controls{display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.hint{margin-top:12px;background:#fffbeb;border:3px dashed #fbbf24;border-radius:16px;padding:12px;text-align:center;font-size:1.1rem}
.hint .guided{display:block;font-size:.85rem;color:#92400e;font-weight:bold}
.hint .h1{display:inline-block;text-align:left;vertical-align:top}
.hint .more{margin-top:8px}
.hint .more .btn{font-size:.95rem;padding:6px 14px}
.hint .hint2{margin-top:10px;padding-top:8px;border-top:2px dotted #fbbf24;text-align:left;display:inline-block}
.feedback{margin-top:14px;border-radius:20px;padding:14px;text-align:center;font-size:1.1rem;animation:pop .25s ease-out}
.feedback.good{background:#dcfce7;border:3px solid var(--green2)}
.feedback.bad{background:#fff1f2;border:3px solid #fda4af}
.fbtitle{font-size:1.45rem;font-weight:bold;margin-bottom:6px}
.expl{margin:10px auto;max-width:720px;line-height:1.7;display:flex;flex-direction:column;align-items:center;gap:6px}
.tellbox{background:#eff6ff;border:3px solid #60a5fa;border-radius:16px;padding:10px 12px;margin:10px auto;max-width:640px}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:680px}
.opt{background:#fff;border:4px solid var(--line);font-size:1.6rem;padding:12px 6px;min-height:84px;color:var(--ink)}
.opt:hover{border-color:var(--main2)}
.opt.right{background:#dcfce7;border-color:var(--green2)}.opt.wrong{background:#ffe4e6;border-color:var(--red)}
.opts.txt .opt{font-size:1.15rem;min-height:64px}
.opts.opts3{grid-template-columns:repeat(3,1fr);max-width:600px}
.opts.opts3 .opt small{display:block;font-size:.85rem;color:#4b5563;font-weight:normal}
.opts.pics{grid-template-columns:repeat(3,1fr)}.opts.pics .opt{padding:10px}
@media (max-width:560px){.opts{grid-template-columns:repeat(2,1fr)}.opts.pics{grid-template-columns:1fr}.opt{font-size:1.3rem}}
.entryrow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-size:2.2rem;font-weight:bold}
.entryrow small{font-size:1rem;color:#6b7280}
.op{font-size:2.2rem;font-weight:bold}
.ebox{display:inline-block;min-width:1.6em;min-height:1.15em;border:3px dashed var(--main2);border-radius:10px;color:var(--main);background:var(--soft2);text-align:center;cursor:pointer;line-height:1.1;margin:2px 0;padding:0 .15em}
.ebox.active{border-style:solid;border-color:var(--main);background:var(--soft);box-shadow:0 0 0 4px var(--line)}
.ebox.okb{border-color:var(--green);color:var(--green)}.ebox.badb{border-color:var(--red);color:var(--red)}
.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:420px;width:100%}
.keypad button{background:var(--soft);color:var(--main);font-size:1.5rem;font-weight:bold;min-height:56px;box-shadow:0 3px 0 var(--line)}
.keypad button.wide{grid-column:span 2;font-size:1.05rem}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .15em;font-weight:bold}
.frac .num{border-bottom:3px solid currentColor;padding:0 .2em}.frac .den{padding:0 .2em}
.frac.big{font-size:1.5em}.frac.huge,.mixed.huge{font-size:1.15em}
.mixed{display:inline-flex;align-items:center;font-weight:bold}.mixed .wn{font-size:1.25em;margin-right:.08em}
.dec{font-weight:bold;white-space:nowrap}.dec.big{font-size:1.4em}.dec.huge{font-size:2.6em}
.bigq{font-size:2rem;font-weight:bold;text-align:center;margin:6px 0}
.cmp{display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;font-size:1.6rem}
.cmp .qm{font-size:2.2rem;font-weight:bold;color:var(--main2);border:4px dashed var(--line);border-radius:50%;width:66px;height:66px;display:flex;align-items:center;justify-content:center}
.story{display:block;font-size:1.2rem;line-height:1.6;background:var(--soft2);border-radius:18px;padding:12px 16px;max-width:720px;margin:0 auto;text-align:left}
.grids{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
table.pv{border-collapse:collapse;margin:8px auto;font-size:1.3rem}
table.pv th{font-size:.8rem;color:#6b7280;padding:2px 10px;font-weight:normal}
table.pv td{border:3px solid var(--line);min-width:48px;text-align:center;font-weight:bold;padding:4px 8px;background:var(--soft2)}
table.pv td.pt{border:none;background:none;min-width:10px}
table.dtab{border-collapse:collapse;margin:6px auto;font-size:1.15rem}
table.dtab th,table.dtab td{border:2px solid #cbd5e1;padding:6px 14px;text-align:center}
table.dtab th{background:var(--soft)}
.colsum{font-size:1.3rem;font-weight:bold;border-collapse:collapse;margin:6px auto}.colsum td{padding:2px 8px;text-align:right}.colsum tr.tot td{border-top:3px solid #1f2937}
.groups{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.plate{background:#fef3c7;border:3px solid #f59e0b;border-radius:50%;min-width:84px;min-height:84px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px;font-size:1.3rem;max-width:120px}
.pict{display:flex;flex-direction:column;gap:6px;font-size:1.6rem;background:#f8fafc;border-radius:14px;padding:10px 14px}
.pict .lab{display:inline-block;width:130px;font-size:1rem;font-weight:bold}.pict .key{font-size:1rem}
.compass{font-size:1.5rem;font-weight:bold;text-align:center;line-height:1.5;background:#f8fafc;border-radius:50%;width:120px;height:120px;display:flex;align-items:center;justify-content:center}
.tentry b{margin:0 .1em}
.example{background:#f0fdf4;border:3px solid #86efac;border-radius:18px;padding:12px 16px;max-width:760px;margin:0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.example h3{margin:0;color:#166534}
/* results */
.results{text-align:center}
.results .stars{font-size:3.4rem;color:var(--gold);letter-spacing:6px}
.results h2{color:var(--main);font-size:1.8rem;margin:8px 0}
table.sum{border-collapse:collapse;margin:10px auto;font-size:1rem;min-width:min(100%,460px)}
table.sum th,table.sum td{border-bottom:2px solid #e5e7eb;padding:6px 10px;text-align:left}
.acc{display:inline-block;height:12px;border-radius:6px;background:var(--green2);vertical-align:middle}
.msg{border-radius:14px;padding:8px 12px;margin:8px auto;max-width:640px}
.msg.up{background:#ecfdf5;color:#065f46}.msg.next{background:#fef3c7;color:#92400e}
.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.say{background:var(--soft);color:var(--main);min-height:40px;padding:4px 12px;border-radius:999px;font-size:1rem;vertical-align:middle;margin-left:6px}
#prompt.bigp{font-size:2.2rem;font-weight:bold}
a.btn{display:inline-flex;align-items:center;text-decoration:none;padding:12px 18px;border-radius:16px;min-height:48px}
.tag.redo{background:#fff7ed;color:#c2410c;border:2px solid #fdba74}
.redonote{margin:6px 0;font-weight:700;color:#9a3412}
.fixedline{display:inline-block;background:#ecfdf5;color:#065f46;border-radius:12px;padding:8px 14px;font-weight:700;margin:4px 0}
.rv{text-align:left}.rvhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}.rvhead b{color:var(--main);font-size:1.1rem}
.rvprompt{justify-content:flex-start}.rvans{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.chip{border-radius:12px;padding:8px 12px;font-weight:700;line-height:1.5}.chip.bad{background:#fef2f2;color:#991b1b;border:2px solid #fecaca}.chip.ok{background:#ecfdf5;color:#065f46;border:2px solid #a7f3d0}
.chip svg{max-height:110px;width:auto;vertical-align:middle}.rvst{font-weight:700;color:#9a3412}
.rvexp{background:var(--soft2);border:3px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0}.rvexp ol.steps{margin:6px 0 4px;padding-left:22px}.rvexp li{margin:3px 0}
.rvtry{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}.rvplay{flex-basis:100%}.rvmini{border:3px dashed var(--line);border-radius:14px;padding:10px;margin-top:6px}
.rvctl{gap:10px;align-items:center;flex-wrap:wrap}.rvctl select{font:inherit;font-size:1rem;padding:8px 10px;border-radius:12px;border:3px solid var(--line);background:#fff;min-height:44px;max-width:100%}
.seg{display:flex;gap:6px}.rvnav{justify-content:space-between;align-items:center;margin:8px 0 20px}.rvnone{text-align:center;font-size:1.1rem}
.rvfb{margin-top:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.rvprompt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rvvar{background:#fff;border-radius:10px;padding:6px 10px;margin:4px 0;font-weight:600}
.rvvar .story,.chip .story{display:inline;background:none;padding:0;margin:0;font-size:inherit}.rvmini{text-align:center}.rvmini .keypad{margin:8px auto}.rvmini .opts{margin:8px auto}
.seg .btn:not(.ghost){color:#fff}

/* ===== English revision extras ===== */
.opts.sent{grid-template-columns:1fr;max-width:640px}
.opts.sent .opt{font-size:1.1rem;text-align:left;justify-content:flex-start;min-height:56px;padding:12px 16px;line-height:1.35}
.opts.txt .opt{font-size:1.2rem}
.esent{font-size:1.35rem;line-height:1.5;background:#faf5ff;border:2px solid #ddd6fe;border-radius:14px;padding:10px 16px;margin:6px auto;max-width:640px;text-align:center}
.esent b{color:#6d28d9}
.passage{font-size:1.1rem;line-height:1.55;background:#fffbeb;border:2px solid #fcd34d;border-radius:14px;padding:12px 18px;max-width:640px;margin:0 auto;text-align:left}
.passage h4{margin:0 0 6px;text-align:center}
.gap{display:inline-block;min-width:3.2em;border-bottom:3px solid #7c3aed;margin:0 4px;height:1.1em;vertical-align:baseline}
.pmark{font-size:1.9rem;font-weight:800;line-height:1}
.tiles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.tiles span{display:inline-flex;align-items:center;justify-content:center;width:42px;height:46px;background:#fef3c7;border:2px solid #f59e0b;border-radius:8px;font-weight:800;font-size:1.4rem;color:#78350f;box-shadow:0 2px 0 #d97706}
.tiles span.gapt{background:#ede9fe;border-color:#7c3aed;color:#7c3aed}
.tiles i{width:16px}
.emo{font-size:3rem;line-height:1.1;text-align:center}
.cipher{display:inline-block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.6rem;font-weight:800;letter-spacing:.18em;background:#111827;color:#a7f3d0;border-radius:10px;padding:8px 16px;margin:4px auto}
.cipher.sm{font-size:1rem;padding:2px 8px;letter-spacing:.1em}
.wsx{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%}
.wsc{background:#fff;border:2px solid #bbf7d0;border-radius:14px;padding:8px 10px;text-align:center}
.wsc p{margin:4px 0}.wsc .tiles span{width:30px;height:34px;font-size:1.05rem}
.wsc .esent{font-size:1rem;padding:6px 8px}
.wsc.wide{width:100%;box-sizing:border-box}
.azs{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}.azs span{font-size:.8rem;font-weight:700;background:#dcfce7;border-radius:4px;padding:1px 4px}
.extable{border-collapse:collapse;margin:4px auto}.extable td,.extable th{border:1px solid #d1d5db;padding:4px 8px}
@media (max-width:560px){.opts.sent{grid-template-columns:1fr}.wsx{grid-template-columns:1fr}.tiles span{width:34px;height:38px;font-size:1.15rem}.esent{font-size:1.15rem}}

</style>
</head>
<body class="alexia">
<header class="topbar">
  <h1 id="homeLink" title="Today's lesson">📖 <span id="titleName">Alexia</span>'s English Revision</h1>
  <span class="pill" id="ptsPill" title="Points">⭐ 0</span>
  <span class="pill" id="streakPill" title="Days in a row">🔥 0</span>
  <button class="iconbtn" id="soundBtn" aria-label="Sound on or off">🔊</button>
  <a class="iconbtn" id="gamesBtn" href="../../index.html" title="My games">🏠<span class="lbl"> Games</span></a>
  <a class="iconbtn" id="switchBtn" href="../../index.html?switch=1" title="Switch player">👥<span class="lbl"> Switch</span></a>
</header>
<main>
<section id="home"><div id="homeBody"></div></section>
<section id="play" class="hidden">
  <div class="playhead"><button class="btn ghost" id="quitBtn">⏸️ Pause</button><div class="secname" id="secName"></div></div>
  <div class="bars"><span>✏️ Questions</span><div class="pbar" id="progBar"><div style="width:0"></div></div><span id="progTxt"></span>
    <span>⏱️ Time</span><div class="pbar time" id="timeBar"><div style="width:0"></div></div><span id="timeTxt"></span></div>
  <div class="timesup hidden" id="timesUp">⏰ 5 minutes are up! Great effort. You can finish the last questions, or pause and come back later.</div>
  <div class="card">
    <div class="prompt"><span id="prompt"></span><button class="say" id="sayBtn" aria-label="Read the question aloud">🔈</button></div>
    <div class="vis" id="qvis"></div>
    <div class="stage" id="stage"></div>
    <div class="controls" id="controls"><button class="btn ghost" id="hintBtn">💡 Hint</button><button class="btn green" id="checkBtn">Check ✓</button></div>
    <div class="hint hidden" id="hintBox"></div>
    <div class="feedback hidden" id="feedback"></div>
  </div>
</section>
<section id="results" class="hidden"><div class="card results" id="resultsCard"></div></section>
<section id="review" class="hidden"><div id="reviewBody"></div></section>
</main>
<!-- "From school today" entries and extra topic modules live in focus.js (see README.md). -->
<script src="focus.js"></script>
<script>
(function(){
'use strict';
/* ===== shared helpers and pictures (copied/adapted from the existing games) ===== */
const OR='#ff8a3d',BL='#3b82f6',GRN='#15803d',RED='#e11d48',PU='#8b5cf6',YEL='#facc15';
const PAL=['#3b82f6','#f97316','#22c55e','#ec4899','#8b5cf6','#facc15','#14b8a6'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const range=n=>[...Array(n).keys()];
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const lcm=(a,b)=>a/gcd(a,b)*b;
const F=(n,d,cls='')=>`<span class="frac ${cls}"><span class="num">${n}</span><span class="den">${d}</span></span>`;
const M=(w,n,d,cls='')=>`<span class="mixed ${cls}"><span class="wn">${w}</span>${F(n,d)}</span>`;
/* decimals as whole numbers of hundredths (Decimal Zoom) */
const plc=v=>v%100===0?0:v%10===0?1:2;
const D=(v,pl)=>{const w=Math.floor(v/100),r=v%100;if(pl==null)pl=plc(v);if(pl===0)return String(w);if(pl===1)return w+'.'+Math.floor(r/10);return w+'.'+String(r).padStart(2,'0');};
/* thousandths */
const D3=(vt,pl)=>{const w=Math.floor(vt/1000),r=vt%1000;if(pl==null)pl=r===0?0:r%100===0?1:r%10===0?2:3;if(pl===0)return String(w);return w+'.'+String(r).padStart(3,'0').slice(0,pl);};
const money=c=>'$'+Math.floor(c/100)+'.'+String(c%100).padStart(2,'0');
const DEC=(s,cls='big')=>`<span class="dec ${cls}">${s}</span>`;

function barSVG({parts=10,fills=[],w=600,h=60,labels=null}){
  const pw=w/parts;let s=`<svg class="bar" viewBox="-6 -8 ${w+12} ${h+16}" aria-label="bar cut into ${parts} parts">`;
  for(let i=0;i<parts;i++){s+=`<rect x="${i*pw}" y="0" width="${pw}" height="${h}" fill="${fills[i]||'#ffffff'}" stroke="#374151" stroke-width="2"/>`;
    if(labels&&labels[i]!=null)s+=`<text x="${i*pw+pw/2}" y="${h/2+8}" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">${labels[i]}</text>`;}
  return s+`<rect x="0" y="0" width="${w}" height="${h}" fill="none" stroke="#1f2937" stroke-width="4"/></svg>`;
}
const fillN=(n,col=OR)=>range(n).map(()=>col);
function grid100(v,{size=200,col=OR}={}){
  const c=size/10;let s=`<svg class="g100" viewBox="-3 -3 ${size+6} ${size+6}" width="${size}" aria-label="hundred grid with ${v} squares shaded">`;
  for(let i=0;i<100;i++){const x=Math.floor(i/10)*c,y=(i%10)*c;s+=`<rect x="${x}" y="${y}" width="${c}" height="${c}" fill="${i<v?col:'#fff'}" stroke="#9ca3af" stroke-width="1"/>`;}
  for(let k=1;k<10;k++)s+=`<line x1="${k*c}" y1="0" x2="${k*c}" y2="${size}" stroke="#374151" stroke-width="2"/>`;
  return s+`<rect x="0" y="0" width="${size}" height="${size}" fill="none" stroke="#1f2937" stroke-width="3"/></svg>`;
}
function pizzaSVG({parts,shaded=0,r=90}){
  const c=r+10,T=2*Math.PI/parts,P=a=>[c+r*Math.cos(a),c+r*Math.sin(a)];
  let s=`<svg class="pizza" viewBox="0 0 ${2*c} ${2*c}" aria-label="pizza cut into ${parts} slices">`;
  s+=`<circle cx="${c}" cy="${c}" r="${r+8}" fill="#d9954a"/>`;
  if(parts===1)return s+`<circle cx="${c}" cy="${c}" r="${r}" fill="${shaded?'#ffb703':'#fff3d6'}" stroke="#8a4b16" stroke-width="2.5"/></svg>`;
  for(let i=0;i<parts;i++){const a0=-Math.PI/2+i*T,a1=a0+T,[x0,y0]=P(a0),[x1,y1]=P(a1);
    s+=`<path d="M${c},${c} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${T>Math.PI?1:0} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${i<shaded?'#ffb703':'#fff3d6'}" stroke="#8a4b16" stroke-width="2.5"/>`;}
  return s+'</svg>';
}
function fracSVG(x,y,n,d,color='#1f2937',size=16){const hw=d>=100?16:11;
  return `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" font-weight="bold" fill="${color}">${n}</text><line x1="${x-hw}" y1="${y+5}" x2="${x+hw}" y2="${y+5}" stroke="${color}" stroke-width="2.5"/><text x="${x}" y="${y+22}" text-anchor="middle" font-size="${size}" font-weight="bold" fill="${color}">${d}</text>`;}
/* number line (from Decimal Zoom). values in "unit" sub-units; lines:[{lo,hi,step,lab,labs,marks,highlight,tag}] */
function dl({lines,w=680,gap=124,top=64,unit=100,fmt=D}){
  const m=40,Lw=w-2*m,H=top+gap*(lines.length-1)+72;const Xf=ln=>v=>m+(v-ln.lo)/(ln.hi-ln.lo)*Lw;
  let s=`<svg class="nl" viewBox="0 0 ${w} ${H}" aria-label="number line">`;
  lines.forEach((ln,j)=>{const y=top+j*gap,X=Xf(ln),st=ln.step,px=X(ln.lo+st)-X(ln.lo);
    s+=`<line x1="${X(ln.lo)}" y1="${y}" x2="${X(ln.hi)}" y2="${y}" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>`;
    if(ln.tag)s+=`<text x="${X(ln.lo)-30}" y="${y-30}" font-size="15" font-weight="bold" fill="#6b7280">${ln.tag}</text>`;
    for(let v=ln.lo;v<=ln.hi+1e-9;v+=st){const x=X(v),whole=v%unit===0,hh=whole?17:10;
      s+=`<line x1="${x}" y1="${y-hh}" x2="${x}" y2="${y+hh}" stroke="#1f2937" stroke-width="${whole?3.5:2.5}"/>`;
      const hl=ln.highlight===v;let lab=whole||ln.lab==='all'||(ln.lab==='ends'&&(v===ln.lo||v===ln.hi))||(ln.labs&&ln.labs.includes(v))||hl;
      if(ln.lab==='all'&&px<26&&!whole&&!hl&&(v/st)%2!==0)lab=false;
      if(lab){const col=hl?GRN:'#1f2937';if(ln.fr&&!whole)s+=fracSVG(x,y+33,ln.fr(v)[0],ln.fr(v)[1],col);else s+=`<text x="${x}" y="${y+40}" text-anchor="middle" font-size="${whole?22:(px<34?15:18)}" font-weight="bold" fill="${col}">${fmt(v)}</text>`;}
      if(hl)s+=`<circle cx="${x}" cy="${y}" r="12" fill="#22c55e" stroke="#fff" stroke-width="3"/>`;}
    (ln.marks||[]).forEach(mk=>{const x=X(mk.v),c=mk.color||OR,ry=y-24-(mk.row||0)*21;
      if(mk.label!=null){if(mk.row)s+=`<line x1="${x}" y1="${y-10}" x2="${x}" y2="${ry+4}" stroke="${c}" stroke-width="1.5"/>`;
        s+=`<text x="${x}" y="${ry}" text-anchor="middle" font-size="16" font-weight="bold" fill="${c}" stroke="#fff" stroke-width="4" paint-order="stroke">${mk.label}</text>`;}
      s+=`<circle cx="${x}" cy="${y}" r="10" fill="${c}" stroke="#fff" stroke-width="3"/>`;});});
  return s+'</svg>';
}
/* column graph (from Data Dash). items:[{icon,name,n,col}] */
function colSVG(items,{max=10,hl=[],nums=false,title='',scale=1,ylabel=''}={}){
  const u=26,L=48,T=16,cw=64,gp=24,k=items.length,W=L+k*(cw+gp)+gp/2,base=T+max*u,Hh=base+48,hv=n=>n/scale;
  let s=`<svg class="graph" viewBox="0 0 ${W} ${Hh}" style="max-width:${Math.round(W*1.15)}px" aria-label="column graph">`;
  for(let v=0;v<=max;v++){const y=base-v*u;s+=`<line x1="${L}" y1="${y}" x2="${W}" y2="${y}" stroke="${v?'#e5e7eb':'#1f2937'}" stroke-width="${v?1.5:3}"/>`;
    s+=`<text x="${L-6}" y="${y+5}" text-anchor="end" font-size="15" fill="#374151">${v*scale}</text>`;}
  s+=`<line x1="${L}" y1="${T-4}" x2="${L}" y2="${base}" stroke="#1f2937" stroke-width="3"/>`;
  items.forEach((it,i)=>{const x=L+gp/2+i*(cw+gp)+4,h=hv(it.n);
    if(h>0)s+=`<rect x="${x}" y="${base-h*u}" width="${cw}" height="${h*u}" rx="4" fill="${it.col}" stroke="${hl.includes(i)?'#111':'rgba(0,0,0,.3)'}" stroke-width="${hl.includes(i)?4:2}"/>`;
    if(nums||hl.includes(i))s+=`<text x="${x+cw/2}" y="${base-h*u-6}" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">${it.n}</text>`;
    s+=`<text x="${x+cw/2}" y="${base+32}" text-anchor="middle" font-size="28">${it.icon}</text>`;});
  return (title?`<div class="gtitle">${esc(title)}</div>`:'')+s+'</svg>';
}
/* pie chart (from Data Dash): slices [{q,col}] out of den */
function pieSVG(slices,{r=90,den=4,labels=null}={}){
  const c=r+10,W=2*c;let a=-Math.PI/2,s=`<svg class="graph" viewBox="0 0 ${W} ${W}" style="max-width:${Math.round(W*1.3)}px" aria-label="pie chart">`;
  const pt=(ang,rr)=>[c+rr*Math.cos(ang),c+rr*Math.sin(ang)];
  slices.forEach((sl,i)=>{const da=sl.q/den*2*Math.PI,b=a+da;
    if(sl.q>=den)s+=`<circle cx="${c}" cy="${c}" r="${r}" fill="${sl.col}" stroke="#fff" stroke-width="3"/>`;
    else if(sl.q>0){const [x1,y1]=pt(a,r),[x2,y2]=pt(b,r);s+=`<path d="M${c},${c} L${x1},${y1} A${r},${r} 0 ${da>Math.PI?1:0} 1 ${x2},${y2} Z" fill="${sl.col}" stroke="#fff" stroke-width="3"/>`;}
    if(labels&&labels[i]){const [lx,ly]=pt(a+da/2,r*0.6);s+=`<text x="${lx}" y="${ly+6}" text-anchor="middle" font-size="${r*0.17}" font-weight="bold" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">${labels[i]}</text>`;}
    a=b;});
  return s+`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#1f2937" stroke-width="3"/></svg>`;
}
/* jump number line (from Number Facts Sprint) */
function jumpSVG(start,steps){
  const pts=[start];steps.forEach(s=>pts.push(pts[pts.length-1]+s));
  const back=steps.length&&steps.every(s=>s<0),n=steps.length,gap=150,W=80+n*gap,xs=pts.map((_,i)=>back?W-40-i*gap:40+i*gap);
  let s=`<svg class="jl" viewBox="0 0 ${W} 120" style="max-width:${W*1.3}px" aria-label="number line">`;
  s+=`<line x1="10" y1="88" x2="${W-10}" y2="88" stroke="#1f2937" stroke-width="3"/>`;
  steps.forEach((st,i)=>{const x1=xs[i],x2=xs[i+1],mx=(x1+x2)/2;
    s+=`<path d="M${x1},84 Q${mx},20 ${x2},84" fill="none" stroke="${st<0?RED:BL}" stroke-width="4"/>`;
    s+=`<text x="${mx}" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="${st<0?RED:BL}">${st<0?'−':'+'}${Math.abs(st)}</text>`;});
  pts.forEach((p,i)=>{s+=`<line x1="${xs[i]}" y1="80" x2="${xs[i]}" y2="96" stroke="#1f2937" stroke-width="3"/><text x="${xs[i]}" y="116" text-anchor="middle" font-size="20" font-weight="bold" fill="${i===pts.length-1?'#16a34a':'#1f2937'}">${p}</text>`;});
  return s+'</svg>';
}
function addJumps(a,b){const up=Math.ceil((a+1)/10)*10-a;return b>up&&a%10!==0?[up,b-up]:[b];}
function subJumps(a,b){const dn=a%10;return dn>0&&b>dn?[-dn,-(b-dn)]:[-b];}
/* ---- new pictures for the daily lessons ---- */
function clockSVG(h,m,{size=200}={}){const c=100,r=90;let s=`<svg class="clock" viewBox="0 0 200 200" width="${size}" aria-label="clock showing ${h}:${String(m).padStart(2,'0')}">`;
  s+=`<circle cx="${c}" cy="${c}" r="${r}" fill="#fff" stroke="#1f2937" stroke-width="6"/>`;
  for(let i=0;i<60;i++){const a=i*Math.PI/30,big=i%5===0,r1=big?r-12:r-6;s+=`<line x1="${c+r1*Math.sin(a)}" y1="${c-r1*Math.cos(a)}" x2="${c+(r-2)*Math.sin(a)}" y2="${c-(r-2)*Math.cos(a)}" stroke="#1f2937" stroke-width="${big?3:1.2}"/>`;}
  for(let i=1;i<=12;i++){const a=i*Math.PI/6;s+=`<text x="${c+(r-27)*Math.sin(a)}" y="${c-(r-27)*Math.cos(a)+7}" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">${i}</text>`;}
  const ha=((h%12)+m/60)*Math.PI/6,ma=m*Math.PI/30;
  s+=`<line x1="${c}" y1="${c}" x2="${c+48*Math.sin(ha)}" y2="${c-48*Math.cos(ha)}" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>`;
  s+=`<line x1="${c}" y1="${c}" x2="${c+72*Math.sin(ma)}" y2="${c-72*Math.cos(ma)}" stroke="#e11d48" stroke-width="5" stroke-linecap="round"/>`;
  return s+`<circle cx="${c}" cy="${c}" r="6" fill="#1f2937"/></svg>`;}
/* rectangle on a square grid; cell=size of one unit; labels:true shows side lengths; shade:true fills */
function rectSVG(w,h,{grid=true,labels=false,unit='',col='#bfdbfe',cut=null}={}){
  const cs=Math.min(34,Math.floor(300/Math.max(w,h))),W=w*cs+100,H=h*cs+60,x0=70,y0=20;
  let s=`<svg class="shape" viewBox="0 0 ${W} ${H}" width="${Math.round(W*1.2)}" aria-label="rectangle ${w} by ${h}">`;
  for(let i=0;i<w;i++)for(let j=0;j<h;j++){const cutOut=cut&&i>=w-cut[0]&&j<cut[1];if(cutOut)continue;s+=`<rect x="${x0+i*cs}" y="${y0+j*cs}" width="${cs}" height="${cs}" fill="${col}" stroke="${grid?'#64748b':col}" stroke-width="${grid?1:0}"/>`;}
  if(cut){const pts=[[0,0],[w-cut[0],0],[w-cut[0],cut[1]],[w,cut[1]],[w,h],[0,h]];s+=`<polygon points="${pts.map(p=>`${x0+p[0]*cs},${y0+p[1]*cs}`).join(' ')}" fill="none" stroke="#1f2937" stroke-width="4"/>`;}
  else s+=`<rect x="${x0}" y="${y0}" width="${w*cs}" height="${h*cs}" fill="none" stroke="#1f2937" stroke-width="4"/>`;
  if(labels){const L=typeof labels==='object'?labels:{};s+=`<text x="${x0+w*cs/2}" y="${y0+h*cs+30}" text-anchor="middle" font-size="18" font-weight="bold">${L.w!=null?L.w:w+' '+unit}</text>`;
    s+=`<text x="${x0-8}" y="${y0+h*cs/2+6}" text-anchor="end" font-size="18" font-weight="bold">${L.h!=null?L.h:h+(unit?' '+unit:'')}</text>`;}
  return s+'</svg>';}
function angleSVG(deg,{label=null,arc=true,size=240,rot=0}={}){const c=120,r=95;const a0=-rot*Math.PI/180,a1=-(rot+deg)*Math.PI/180;
  let s=`<svg class="shape" viewBox="0 0 240 240" width="${size}" aria-label="angle">`;
  s+=`<line x1="${c}" y1="${c}" x2="${c+r*Math.cos(a0)}" y2="${c+r*Math.sin(a0)}" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>`;
  s+=`<line x1="${c}" y1="${c}" x2="${c+r*Math.cos(a1)}" y2="${c+r*Math.sin(a1)}" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>`;
  if(arc){if(deg===90){const q=22,p=(a,l)=>[c+l*Math.cos(a),c+l*Math.sin(a)];const A=p(a0,q),B=p(a1,q),C=[A[0]+B[0]-c,A[1]+B[1]-c];s+=`<polyline points="${A} ${C} ${B}" fill="none" stroke="${RED}" stroke-width="3"/>`;}
    else{const ar=34,[x1,y1]=[c+ar*Math.cos(a0),c+ar*Math.sin(a0)],[x2,y2]=[c+ar*Math.cos(a1),c+ar*Math.sin(a1)];s+=`<path d="M${x1},${y1} A${ar},${ar} 0 ${deg>180?1:0} 0 ${x2},${y2}" fill="none" stroke="${RED}" stroke-width="3"/>`;}}
  if(label!=null){const am=-(rot+deg/2)*Math.PI/180;s+=`<text x="${c+58*Math.cos(am)}" y="${c+58*Math.sin(am)+6}" text-anchor="middle" font-size="20" font-weight="bold" fill="${RED}">${label}</text>`;}
  return s+`<circle cx="${c}" cy="${c}" r="4" fill="#1f2937"/></svg>`;}
/* straight line split into two angles */
function straightSVG(a,{la,lb}={}){const c=150,r=110,ar=-a*Math.PI/180;let s=`<svg class="shape" viewBox="0 0 300 160" width="300" aria-label="angles on a straight line">`;
  s+=`<line x1="${c-r}" y1="${c-20}" x2="${c+r}" y2="${c-20}" stroke="#1f2937" stroke-width="5"/>`;const cy=c-20;
  s+=`<line x1="${c}" y1="${cy}" x2="${c+r*Math.cos(ar)}" y2="${cy+r*Math.sin(ar)}" stroke="#1f2937" stroke-width="5"/>`;
  const m1=ar/2,m2=(ar-Math.PI)/2;s+=`<text x="${c+52*Math.cos(m1)}" y="${cy+52*Math.sin(m1)+6}" text-anchor="middle" font-size="19" font-weight="bold" fill="${BL}">${la}</text><text x="${c+52*Math.cos(m2)}" y="${cy+52*Math.sin(m2)+6}" text-anchor="middle" font-size="19" font-weight="bold" fill="${RED}">${lb}</text>`;
  return s+'</svg>';}
/* spinner with coloured sectors [{col,name}] equal size */
function spinnerSVG(cols,{r=90}={}){const n=cols.length,c=r+10;let s=`<svg class="graph" viewBox="0 0 ${2*c} ${2*c}" style="max-width:${2*c*1.2}px" aria-label="spinner with ${n} equal parts">`;
  cols.forEach((col,i)=>{const a0=-Math.PI/2+i*2*Math.PI/n,a1=a0+2*Math.PI/n;s+=`<path d="M${c},${c} L${c+r*Math.cos(a0)},${c+r*Math.sin(a0)} A${r},${r} 0 ${n===1?1:0} 1 ${c+r*Math.cos(a1)},${c+r*Math.sin(a1)} Z" fill="${col}" stroke="#fff" stroke-width="3"/>`;});
  s+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#1f2937" stroke-width="3"/><line x1="${c}" y1="${c}" x2="${c+r*0.3}" y2="${c-r*0.65}" stroke="#111" stroke-width="5" stroke-linecap="round"/><circle cx="${c}" cy="${c}" r="7" fill="#111"/>`;
  return s+'</svg>';}
/* bag of marbles: counts [{col,n}] */
function bagSVG(groups){const all=[];groups.forEach(g=>{for(let i=0;i<g.n;i++)all.push(g.col);});const per=6,rows=Math.ceil(all.length/per),W=per*34+40,H=rows*34+50;
  let s=`<svg class="graph" viewBox="0 0 ${W} ${H}" style="max-width:${W*1.2}px" aria-label="bag of ${all.length} marbles">`;
  s+=`<path d="M10,30 Q${W/2},6 ${W-10},30 L${W-20},${H-6} Q${W/2},${H+4} 20,${H-6} Z" fill="#fef3c7" stroke="#92400e" stroke-width="3"/>`;
  all.forEach((col,i)=>{s+=`<circle cx="${37+(i%per)*34}" cy="${46+Math.floor(i/per)*34}" r="14" fill="${col}" stroke="rgba(0,0,0,.3)" stroke-width="2"/>`;});
  return s+'</svg>';}
/* dot array rows x cols */
function arraySVG(r,c,{col=BL,ring=0}={}){const g=30,W=c*g+20,H=r*g+20;let s=`<svg class="graph" viewBox="0 0 ${W} ${H}" style="max-width:${Math.min(560,W*1.4)}px" aria-label="array of ${r} rows of ${c}">`;
  for(let i=0;i<r;i++)for(let j=0;j<c;j++)s+=`<circle cx="${25+j*g}" cy="${25+i*g}" r="11" fill="${col}"/>`;
  if(ring)for(let i=0;i<r;i++)s+=`<rect x="8" y="${9+i*g}" width="${W-16}" height="${g-2}" rx="14" fill="none" stroke="${RED}" stroke-width="2"/>`;
  return s+'</svg>';}
/* equal groups: g plates with k items each */
function groupsSVG(g,k,{icon='🍪'}={}){let h='<div class="groups">';for(let i=0;i<g;i++)h+=`<div class="plate">${icon.repeat(k)}</div>`;return h+'</div>';}
/* coins & notes: list of cents values */
const COIN={5:['5c','#cbd5e1',22],10:['10c','#cbd5e1',26],20:['20c','#cbd5e1',30],50:['50c','#cbd5e1',33],100:['$1','#fbbf24',27],200:['$2','#fbbf24',24]};
const NOTE={500:['$5','#f9a8d4'],1000:['$10','#93c5fd'],2000:['$20','#fca5a5'],5000:['$50','#fde68a']};
function moneySVG(list){let x=10;const parts=[];list.forEach(v=>{if(NOTE[v]){parts.push(`<rect x="${x}" y="14" width="110" height="60" rx="6" fill="${NOTE[v][1]}" stroke="#374151" stroke-width="2"/><text x="${x+55}" y="52" text-anchor="middle" font-size="22" font-weight="bold">${NOTE[v][0]}</text>`);x+=120;}
  else{const [l,col,r]=COIN[v];parts.push(`<circle cx="${x+r}" cy="44" r="${r}" fill="${col}" stroke="#374151" stroke-width="2"/><text x="${x+r}" y="50" text-anchor="middle" font-size="${r>26?17:15}" font-weight="bold">${l}</text>`);x+=2*r+10;}});

  const wordclass={id:'wordclass',title:'Word Classes',icon:'🧩',dedupByText:true,code:'EN2-CWT-01 → EN3-CWT-01',

<p><b style="color:#2563eb">Noun</b> = person, place, thing or idea (kitten). <b style="color:#16a34a">Verb</b> = doing or being word (sniffed). <b style="color:#7c3aed">Adjective</b> = describes a noun (curious). <b style="color:#ea580c">Adverb</b> = how, when or where (slowly).</p>

  const apostrophe={id:'apostrophe',title:'Apostrophes',icon:'✏️',dedupByText:true,code:'EN2-CWT-01 · EN2-SPELL-01 → EN3',

    example(){return {html:`<h3>✏️ Two jobs for an apostrophe</h3><p><b>1. Missing letters:</b> do not → don’t, it is → it’s, they are → they’re.</p><p><b>2. Belonging:</b> one dog → the <b>dog’s</b> bone. Many dogs → the <b>dogs’</b> bones. Plurals without s → the <b>children’s</b> toys.</p><p>⚠️ <b>its</b> (belonging to it) has no apostrophe. <b>it’s</b> always means it is / it has.</p>`};}};

  else{prevDay.extra=(prevDay.extra||0)+1;prevDay.stars=Math.max(prevDay.stars||0,st);}
  R.finished=true;S.bestStreak=Math.max(S.bestStreak,dayStreak());save();
  const nxt=curTopic();
  if(mastered)msgs.unshift(`<div class="msg up">🎓 <b>You mastered ${TOPICS[mastered].icon} ${esc(TOPICS[mastered].title)}!</b> It joins your mixed review.</div>`+(nxt?`<div class="msg next">🆕 Next lesson starts a new topic: <b>${TOPICS[nxt].icon} ${esc(TOPICS[nxt].title)}</b></div>`:''));
  const secRows=Object.keys(SECN).filter(k=>res.some(r=>r.sec===k)).map(k=>{const rr=res.filter(r=>r.sec===k);return `<tr><td>${SECN[k][0]} ${SECN[k][1]}</td><td>${rr.filter(r=>r.ok).length} / ${rr.length}</td></tr>`;}).join('');
  const msg=p>=0.95?`Amazing, ${NAME}! 🏅`:p>=0.8?`Great work, ${NAME}!`:p>=0.6?`Well done, ${NAME}!`:`Good effort, ${NAME}! Tomorrow's Fix-it will help. 💪`;
  $('#resultsCard').innerHTML=`<div class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div><h2>${msg}</h2>
   <p style="font-size:1.3rem">You got <b>${c} out of ${n}</b> · +${R.pts} points · best streak 🔥 ${R.best} · ⏱️ ${Math.max(1,Math.round(R.el/60000))} min</p>
   ${R.rq.length?`<p class="fixedline" id="fixedLine">🔧 You fixed <b>${R.fixed} of ${R.rq.length}</b> question${R.rq.length>1?'s':''} you missed${R.fixed<R.rq.length?` (the answer was shown for the other ${R.rq.length-R.fixed})`:'. Brilliant!'}<span class="small"> · score and stars count first tries</span></p>`:''}${msgs.join('')}
   ${(()=>{const nm=res.filter(r=>!r.ok).length;return nm?`<div style="margin:10px 0"><button class="btn huge orange" id="rRev">👨‍👦 Review mistakes together (${nm})</button></div>`:`<p class="small">🎉 No mistakes to review today.</p>`;})()}
   ${R.kind==='review'?weekSummary():`<table class="sum">${secRows}</table>`}
   <div style="margin:10px 0">${weekHTML()}</div>
   <div class="row" style="justify-content:center;margin-top:14px"><button class="btn ghost" id="rHome">📅 Back to today</button><a class="btn" style="text-decoration:none;display:inline-flex;align-items:center" href="../../index.html">🏠 My games</a></div>`;
  show('results');q=null;topbar();if(st>=2){sfx('win');confetti();}$('#rHome').onclick=home;const rv=$('#rRev');if(rv)rv.onclick=()=>openReview(TODAY,'results');}
function weekSummary(){const wk=WEEKOF(TODAY),MT=wk.slice(0,4);const L=S.log.filter(e=>e.d>=wk[0]&&e.d<=TODAY&&TOPICS[e.t]&&!TOPICS[e.t].warm);
  const daysDone=MT.filter(d=>S.days[d]&&S.days[d].done).length;
  const by={};L.forEach(e=>{const o=by[e.t]||(by[e.t]={n:0,c:0,en:0,ec:0,tn:0,tc:0});o.n++;if(e.ok)o.c++;if(e.d<TODAY){o.en++;if(e.ok)o.ec++;}else{o.tn++;if(e.ok)o.tc++;}});
  const rows=Object.entries(by).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n);
  const improved=rows.filter(([id,o])=>o.en>=2&&o.tn>=2&&o.tc/o.tn>o.ec/o.en+0.05).map(([id])=>TOPICS[id].icon+' '+esc(TOPICS[id].title));
  const practise=rows.filter(([id,o])=>o.c/o.n<0.8).slice(0,3).map(([id])=>TOPICS[id].icon+' '+esc(TOPICS[id].title));
  return `<div class="card" id="weekSummary" style="text-align:left;box-shadow:none;border:3px solid var(--line)"><h3 style="margin:0 0 6px;color:var(--main)">📋 My week</h3>
   <p><b>Days completed (Mon–Thu):</b> ${daysDone} / 4 ${MT.map(d=>S.days[d]&&S.days[d].done?'✅':'⬜').join(' ')}</p>
   <table class="sum"><tr><th>Topic</th><th>Accuracy this week</th></tr>${rows.map(([id,o])=>{const a=Math.round(100*o.c/o.n);return `<tr><td>${TOPICS[id].icon} ${esc(TOPICS[id].title)}</td><td><span class="acc" style="width:${Math.max(4,a)}px;background:${a>=80?'#22c55e':a>=60?'#facc15':'#fb923c'}"></span> ${a}% <span class="small">(${o.c}/${o.n})</span></td></tr>`;}).join('')}</table>
   <p><b>🌟 Improved:</b> ${improved.length?improved.join(', '):rows.length?'Steady all week. Keep it up!':'–'}</p>
   <p><b>🎯 Practise next:</b> ${practise.length?practise.join(', '):'Everything is 80% or better. Ready for new challenges!'}</p>${curTopic()?`<p><b>🧭 Next week's topic:</b> ${TOPICS[curTopic()].icon} ${esc(TOPICS[curTopic()].title)}</p>`:''}</div>`;}
function confetti(){const cols=['#7c3aed','#ec4899','#f59e0b','#22c55e','#0ea5e9','#ff8a3d'];
  for(let i=0;i<50;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];d.style.animationDuration=(1.8+Math.random()*2)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),5000);}}
/* ---------- review mistakes together (grown-up + child) ----------
   Every question answered wrong at the FIRST attempt is kept for 14 days in S.rev[date]:
   the question (prompt, picture, options/boxes, answer, explanation), the child's first answer,
   and each later redo attempt. Extra-practice runs are not recorded. */
const REV_DAYS=14,REV_MAX=60;
const givenHTML=q=>q.kind==='choice'?(q.chosen!=null?q.choices[q.chosen]:'–'):q.layout.replace(/\[\[(\w+)\]\]/g,(m,id)=>`<b>${esc((q.f&&q.f[id])||'')||'–'}</b>`);
function revPayload(q){const o={};['prompt','vis','kind','choices','answer','cls','layout','layoutPre','fields','dot','hint','hint2','explain','sub'].forEach(k=>{if(q[k]!==undefined)o[k]=q[k];});
  if(o.vis&&o.vis.length>40000)o.vis='';return JSON.parse(JSON.stringify(o));}
function revPrune(){if(!S.rev)S.rev={};const lim=addDays(TODAY,-(REV_DAYS-1));Object.keys(S.rev).forEach(d=>{if(d<lim)delete S.rev[d];});}
function revRecord(q,it,rk,ok,correct){try{revPrune();const L=S.rev[RUN.date]||(S.rev[RUN.date]=[]);const id=`${RUN.variant}|${it.qi}`;
  if(!rk){if(!ok&&L.length<REV_MAX)L.push({id,v:RUN.variant,qi:it.qi,it:{t:it.t,lvl:it.lvl,sub:it.sub||null,sec:it.sec,up:it.up||0},kind:RUN.kind,q:revPayload(q),a:givenHTML(q),c:correct,tries:[],fixed:false,out:false});}
  else{const e=L.find(x=>x.id===id);if(!e)return;const nn=q.prompt!==e.q.prompt||JSON.stringify(q.answer)!==JSON.stringify(e.q.answer);
    e.tries.push({a:givenHTML(q),ok,c:correct,p:nn?q.prompt:null,x:nn?q.explain:null});if(ok)e.fixed=true;if(rk.out)e.out=true;}}catch(err){window.DAILY_ERRORS.push('rev '+err);}}
/* a lesson saved before this feature: rebuild its questions (same seed) from the saved run; the answers given were not stored */
function revLegacy(){const R=S.run;if(!R||R.date!==TODAY||!R.res||!R.res.some(r=>!r.ok))return [];
  if((S.rev&&S.rev[TODAY]||[]).some(e=>e.v===R.variant))return [];
  initRun(R);let qs;try{qs=buildAll(R);}catch(e){return [];}
  const pos=R.items.map((it,i)=>i).filter(i=>R.items[i].kind!=='example');const out=[];
  R.res.forEach((r,j)=>{if(r.ok)return;const i=r.qi!=null?R.items.findIndex(x=>x.qi===r.qi):pos[j];if(i==null||i<0||!qs[i])return;const it=R.items[i],qq=qs[i];
    const k=(R.rq||[]).find(x=>x.of===i);const c=qq.kind==='choice'?qq.choices[qq.answer]:qq.layout.replace(/\[\[(\w+)\]\]/g,(m,id)=>`<b>${esc(qq.answer[id]||'')}</b>`);
    out.push({id:`${R.variant}|${it.qi}`,v:R.variant,qi:it.qi,it:{t:it.t,lvl:it.lvl,sub:it.sub||null,sec:it.sec,up:it.up||0},kind:R.kind,q:revPayload(qq),a:null,c,tries:[],fixed:!!(k&&k.ok),out:!!(k&&k.out),legacy:true,ntries:k?k.tries-1+(k.ok?1:0):0,d:TODAY});});
  return out;}
function revList(sel){const ds=sel==='week'?WEEK:[sel];let L=[];ds.forEach(d=>{L=L.concat((S.rev&&S.rev[d]||[]).filter(e=>e&&e.q&&e.it).map(e=>Object.assign({d},e)));if(d===TODAY)L=L.concat(revLegacy());});return L;}
const revCount=d=>revList(d).length;
let RV={sel:TODAY,mode:'list',i:0,from:'home'};
function revSteps(ex){if(!ex)return '';const parts=String(ex).split(/<br\s*\/?>|(?<=[.!?])\s+(?=[A-Z])/).map(x=>x.trim()).filter(Boolean);
  return parts.length>1?`<ol class="steps">${parts.map(p=>`<li>${p}</li>`).join('')}</ol>`:`<div>${parts[0]||''}</div>`;}
function revItem(e,n,N){const T0=TOPICS[e.it.t],sn=SECN[e.it.sec]||['',''],pend=!e.fixed&&!e.out&&e.d===TODAY&&S.run&&S.run.date===TODAY&&!S.run.finished;
  const tries=e.tries.map((t,j)=>`<div class="chip ${t.ok?'ok':'bad'}">${t.ok?'✅':'❌'} Try ${j+2}${t.p?` <span class="small">· same type, new numbers:</span><div class="rvvar">${t.p}</div>`:''}${t.p?'Answer: ':': '}${t.a}${!t.ok&&t.p?` <span class="small">(correct: ${t.c})</span>`:''}</div>`).join('');
  const st=e.fixed?'🔧 Fixed it on a later try!':e.out?'The answer was shown after 3 tries.':pend?'⏳ Still waiting in the Try again round.':e.legacy&&e.ntries?`Tried again ${e.ntries} time${e.ntries>1?'s':''}.`:'Not tried again yet.';
  return `<article class="card rv" data-rv="${n}" aria-label="Mistake ${n+1} of ${N}">
   <div class="rvhead"><b>Mistake ${n+1} of ${N}</b><span class="tag">${sn[0]} ${sn[1]}</span><span class="tag">${T0?T0.icon+' '+esc(T0.title):''}</span>${RV.sel==='week'?`<span class="small">${weekday(e.d)}</span>`:''}</div>
   <div class="prompt rvprompt"><span class="rvp">${e.q.prompt}</span><button class="say rvsay" aria-label="Read the question aloud">🔈</button></div>
   ${e.q.vis?`<div class="vis">${e.q.vis}</div>`:''}
   <div class="rvans"><div class="chip bad">❌ ${esc(NAME)}'s first answer: ${e.a!=null?e.a:'<i>not recorded (this lesson started before the review screen was added)</i>'}</div>${tries}
    <div class="rvst">${st}</div><div class="chip ok">✅ Correct answer: ${e.c}</div></div>
   <div class="rvexp"><b>👣 Step by step</b>${revSteps(e.q.explain)}${e.q.hint?`<div class="small">💡 Tip: ${e.q.hint}</div>`:''}${e.q.hint2?`<div class="small">🔎 More help: ${e.q.hint2}</div>`:''}</div>
   <div class="rvtry"><button class="btn green" data-try="${n}">🔁 Try it again</button><button class="btn ghost" data-sayexp="${n}">🔈 Read the steps</button><div class="rvplay" id="rvplay${n}"></div></div></article>`;}
function openReview(sel,from){RV={sel:sel||TODAY,mode:RV.mode||'list',i:0,from:from||'home'};renderReview();show('review');}
function renderReview(){const L=revList(RV.sel),N=L.length;if(RV.i>=N)RV.i=Math.max(0,N-1);
  const days=Object.keys(S.rev||{}).concat(WEEK.filter(d=>d<=TODAY)).filter((d,i,a)=>a.indexOf(d)===i).sort().reverse();
  const lab=d=>`${d===TODAY?'Today':weekday(d)} ${parseD(d).getDate()} ${parseD(d).toLocaleDateString('en-AU',{month:'short'})}${(S.days[d]&&S.days[d].kind==='review')||(revList(d)[0]||{}).kind==='review'?' · 🏆 Week review':''} (${revCount(d)})`;
  const opts=days.map(d=>`<option value="${d}"${RV.sel===d?' selected':''}>${lab(d)}</option>`).join('')+`<option value="week"${RV.sel==='week'?' selected':''}>📆 This whole week (${revCount('week')})</option>`;
  const body=!N?`<div class="card rvnone">🎉 <b>No mistakes to look at${RV.sel==='week'?' this week':RV.sel===TODAY?' today':' on this day'}.</b><div class="small">${RV.sel===TODAY&&!(S.days[TODAY]&&S.days[TODAY].done)&&!(S.run&&S.run.date===TODAY)?'Today\'s lesson hasn\'t been started yet.':'Questions answered wrong the first time show up here, with the answer and the steps.'} Choose another day above to look back.</div></div>`:
   RV.mode==='one'?revItem(L[RV.i],RV.i,N)+`<div class="row rvnav"><button class="btn ghost" id="rvPrev" ${RV.i<=0?'disabled':''}>◀ Previous</button><span><b>${RV.i+1}</b> of ${N}</span><button class="btn" id="rvNext" ${RV.i>=N-1?'disabled':''}>Next mistake ▶</button></div>`:L.map((e,n)=>revItem(e,n,N)).join('');
  $('#reviewBody').innerHTML=`<div class="card rvtop"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0;color:var(--main)">👨‍👦 Review mistakes together</h2><button class="btn ghost" id="rvBack">⬅ Back</button></div>
    <p class="small">Look at each question together: what ${esc(NAME)} answered, the correct answer and the steps. Tap <b>Try it again</b> to have another go (no score change).</p>
    <div class="row rvctl"><label for="rvDay"><b>Day:</b></label><select id="rvDay">${opts}</select>
     <div class="seg" role="group" aria-label="View"><button class="btn small ${RV.mode==='list'?'':'ghost'}" id="rvList" aria-pressed="${RV.mode==='list'}">📋 List</button><button class="btn small ${RV.mode==='one'?'':'ghost'}" id="rvOne" aria-pressed="${RV.mode==='one'}">👉 One at a time</button></div></div></div>${body}`;
  $('#rvBack').onclick=()=>{if(RV.from==='results'){show('results');}else home();};
  $('#rvDay').onchange=e=>{RV.sel=e.target.value;RV.i=0;renderReview();};
  $('#rvList').onclick=()=>{RV.mode='list';renderReview();};$('#rvOne').onclick=()=>{RV.mode='one';renderReview();};
  const pv=$('#rvPrev'),nx=$('#rvNext');if(pv)pv.onclick=()=>{RV.i--;renderReview();window.scrollTo(0,0);};if(nx)nx.onclick=()=>{RV.i++;renderReview();window.scrollTo(0,0);};
  document.querySelectorAll('#reviewBody .rvsay').forEach(b=>b.onclick=()=>say(spoken(b.parentNode.querySelector('.rvp'))+'. '+(b.closest('.rv').querySelector('.vis')?spoken(b.closest('.rv').querySelector('.vis')):'')));
  document.querySelectorAll('#reviewBody [data-sayexp]').forEach(b=>b.onclick=()=>say(spoken(b.closest('.rv').querySelector('.rvexp'))));
  document.querySelectorAll('#reviewBody [data-try]').forEach(b=>b.onclick=()=>revTry(L[+b.dataset.try],+b.dataset.try));}
/* "Try it again": a small stand-alone question player inside the card (options reshuffled, no points, no score change) */
function revTry(e,n){const box=document.getElementById('rvplay'+n);if(!box)return;let Q=Object.assign({},e.q);
  try{const it=Object.assign({},e.it);const g=makeQ(it,e.d,e.v,e.qi,new Set());if(g&&g.prompt===e.q.prompt&&JSON.stringify(g.answer)===JSON.stringify(e.q.answer)&&g.check)Q.check=g.check;}catch(err){}
  const f={};let active=null,done=false;
  const draw=()=>{if(Q.kind==='choice'){const ids=Q.choices.map((c,i)=>i),p=shuffle(ids.slice());if(p.length>1&&p.join()===ids.join())p.push(p.shift());
      box.innerHTML=`<div class="rvmini"><div class="small"><b>Your turn!</b> Pick an answer.</div><div class="opts ${Q.cls||''}">${p.map(i=>`<button class="opt" data-ro="${i}">${Q.choices[i]}</button>`).join('')}</div><div class="rvfb" aria-live="polite"></div></div>`;
      box.querySelectorAll('[data-ro]').forEach(b=>b.onclick=()=>{if(done)return;done=true;const i=+b.dataset.ro,ok=i===Q.answer;
        box.querySelectorAll('[data-ro]').forEach(x=>{if(+x.dataset.ro===Q.answer)x.classList.add('right');else if(x===b)x.classList.add('wrong');});fbk(ok);});}
    else{Q.fields.forEach(x=>f[x.id]='');active=Q.fields[0].id;
      const lay=(Q.layoutPre||'')+Q.layout.replace(/\[\[(\w+)\]\]/g,(m,id)=>`<span class="ebox" data-rf="${id}" role="button" tabindex="0" aria-label="answer box">&nbsp;</span>`);
      box.innerHTML=`<div class="rvmini"><div class="small"><b>Your turn!</b> Type the answer, then Check.</div><div class="entryrow">${lay}</div><div class="keypad">${[1,2,3,4,5,6,7,8,9,0].map(k=>`<button data-rk="${k}">${k}</button>`).join('')}${Q.dot?'<button data-rk=".">.</button>':''}<button data-rk="del" class="wide">⌫ Delete</button>${Q.fields.length>1?'<button data-rk="next" class="wide">Next box ➜</button>':''}</div><div class="row" style="justify-content:center"><button class="btn green" data-rcheck>Check ✓</button></div><div class="rvfb" aria-live="polite"></div></div>`;
      const ref=()=>{Q.fields.forEach(x=>{const el=box.querySelector(`[data-rf="${x.id}"]`);if(el){el.innerHTML=f[x.id]||'&nbsp;';el.classList.toggle('active',!done&&x.id===active);}});};ref();
      box.querySelectorAll('[data-rf]').forEach(el=>el.onclick=()=>{active=el.dataset.rf;ref();});
      box.querySelectorAll('[data-rk]').forEach(b=>b.onclick=()=>{if(done)return;const k=b.dataset.rk,i=Q.fields.findIndex(x=>x.id===active),fl=Q.fields[i];
        if(k==='next')active=Q.fields[(i+1)%Q.fields.length].id;else if(k==='del')f[active]=f[active].slice(0,-1);else if(k==='.'){if(Q.dot&&!f[active].includes('.'))f[active]+=f[active]?'.':'0.';}else if(f[active].length<fl.len)f[active]+=k;sfx('tap');ref();});
      box.querySelector('[data-rcheck]').onclick=()=>{if(done||!Q.fields.every(x=>f[x.id]!==''))return;done=true;const ok=Q.check?!!Q.check(f):Q.fields.every(x=>same(f[x.id],Q.answer[x.id]));
        Q.fields.forEach(x=>{const el=box.querySelector(`[data-rf="${x.id}"]`);if(el){el.classList.remove('active');el.classList.add(ok?'okb':'badb');}});box.querySelector('.keypad').remove();fbk(ok);};}};
  const fbk=ok=>{sfx(ok?'good':'bad');box.querySelector('.rvfb').innerHTML=(ok?`<div class="chip ok">🎉 Yes! That's it.</div>`:`<div class="chip bad">🤔 Not yet. The answer is ${e.c}. Look at the steps together.</div>`)+`<button class="btn ghost small" data-again>🔁 Try once more</button>`;
    box.querySelector('[data-again]').onclick=()=>{done=false;draw();};};
  draw();box.scrollIntoView({behavior:'smooth',block:'nearest'});}
/* ---------- events ---------- */
$('#homeLink').onclick=()=>{if(RUN&&!RUN.finished)save();home();};
$('#quitBtn').onclick=()=>{save();home();};
$('#soundBtn').onclick=()=>{S.sound=!S.sound;save();topbar();};
$('#sayBtn').onclick=()=>say(spoken($('#prompt'))+'. '+spoken($('#qvis')));
$('#hintBtn').onclick=()=>showHint(false);
$('#checkBtn').onclick=()=>{if(!q||q.done||q.kind==='choice')return;answer(gradeEntry());};
$('#stage').addEventListener('click',e=>{if(!q||q.done)return;const o=e.target.closest('[data-opt]');if(o&&q.kind==='choice'){q.chosen=+o.dataset.opt;answer(q.chosen===q.answer);return;}
  const k=e.target.closest('[data-key]');if(k){key(k.dataset.key);return;}const f=e.target.closest('[data-field]');if(f){q.active=f.dataset.field;refresh();}});
document.addEventListener('keydown',e=>{if(!q)return;if(q.done&&e.key==='Enter'){const n=$('#nextBtn');if(n){e.preventDefault();n.click();}return;}
  if(q.fields&&!q.done){if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==='.')key('.');else if(e.key==='Backspace')key('del');else if(e.key==='Tab'||e.key===':'||e.key==='/'){e.preventDefault();key('next');}else if(e.key==='Enter')$('#checkBtn').click();}});
window.addEventListener('pagehide',()=>{if(RUN)save();});
window.DAILY={get S(){return S;},get q(){return q;},get RUN(){return RUN;},get QS(){return QS;},TOPICS,PATH,STORE,TODAY,planLesson,makeQ,buildAll,home,answer:ok=>answer(ok),
  correctFill(){if(!q||q.example)return;if(q.kind==='choice'){q.chosen=q.answer;answer(true);return;}q.fields.forEach(f=>q.f[f.id]=String(q.answer[f.id]));refresh();answer(gradeEntry());},
  wrongFill(){if(!q||q.example)return;if(q.kind==='choice'){q.chosen=(q.answer+1)%q.choices.length;answer(false);return;}q.fields.forEach(f=>q.f[f.id]='999');answer(gradeEntry());},
  H,redoQ,pendingRedos,openReview,revList,revRecord,goSection,practiseSection,secProgress,setRNG:s=>{RNG=mulberry32(s);},gen:(id,l,sub)=>TOPICS[id].gen.call(TOPICS[id],H,l,sub),gradeEntry,same,activeFocus,weekFocus};
home();

})();
