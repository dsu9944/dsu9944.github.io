<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>Learning Games – Who's playing?</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:#1f2937;min-height:100vh;font-size:19px;background:linear-gradient(160deg,#fdf2ff,#e0f2fe 55%,#ecfdf5)}
button{font-family:inherit;font-size:1rem;cursor:pointer;border:none;border-radius:16px;padding:12px 18px;min-height:50px;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:4px solid #fbbf24;outline-offset:2px}
.hidden{display:none!important}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(90deg,#7c3aed,#2563eb);color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.15)}
header h1{margin:0;font-size:1.25rem;flex:1}
.hbtn{background:rgba(255,255,255,.22);color:#fff;min-height:42px;padding:6px 14px;border-radius:999px;font-weight:bold}
main{max-width:900px;margin:0 auto;padding:18px}
h2{color:#7c3aed;text-align:center;font-size:1.9rem;margin:10px 0 18px}
.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.prof{background:#fff;border-radius:28px;padding:22px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(124,58,237,.14);border:5px solid transparent;transition:transform .12s;color:#1f2937}
.prof:hover{transform:translateY(-4px)}
.avatar{width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:72px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12)}
.avatar svg{width:78px;height:78px}
.prof .nm{font-size:1.7rem;font-weight:bold}
.prof .sub{font-size:.9rem;color:#6b7280}
.card{background:#fff;border-radius:24px;padding:18px;box-shadow:0 6px 20px rgba(37,99,235,.12);margin-bottom:16px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}
.game{display:flex;gap:14px;align-items:center;text-decoration:none;color:#1f2937;background:#fff;border-radius:24px;padding:18px;border:4px solid #e9d5ff;box-shadow:0 6px 18px rgba(124,58,237,.12);transition:transform .12s}
.game:hover{transform:translateY(-3px);border-color:#a78bfa}
.game .gi{font-size:3rem}
.game .gt{font-size:1.3rem;font-weight:bold;color:#7c3aed}
.game .gs{font-size:.9rem;color:#6b7280}
.game .gp{font-size:.95rem;margin-top:4px}
.stars{color:#f59e0b;letter-spacing:1px}
.badge{display:inline-block;background:#dcfce7;color:#166534;border-radius:999px;padding:2px 10px;font-size:.85rem;font-weight:bold}
.badge.new{background:#fef3c7;color:#92400e}
.game.done{border-color:#bbf7d0}
.who{display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.who .avatar{width:90px;height:90px;font-size:50px}
.who .avatar svg{width:54px;height:54px}
.btn{background:#7c3aed;color:#fff;font-weight:bold;box-shadow:0 4px 0 #5b21b6}
.btn.ghost{background:#ede9fe;color:#7c3aed;box-shadow:0 4px 0 #c4b5fd}
.center{text-align:center}
footer{text-align:center;font-size:.85rem;color:#6b7280;padding:10px 0 24px}
</style>
</head>
<body>
<header>
  <h1>🎮 Learning Games</h1>
  <button class="hbtn hidden" id="switchBtn">👥 Switch player</button>
</header>
<main>
  <!-- picker -->
  <section id="picker">
    <h2>Who's playing today?</h2>
    <div class="profiles" id="profiles"></div>
  </section>
  <!-- child home -->
  <section id="kid" class="hidden">
    <div class="who"><div id="kidAvatar"></div><div><h2 id="kidHello" style="margin:0;text-align:left"></h2><div style="color:#6b7280">Pick a game to play!</div></div></div>
    <div class="games" id="games"></div>
    <div class="center" style="margin-top:22px"><button class="btn ghost" id="switchBtn2">👥 Not you? Switch player</button></div>
  </section>
</main>
<footer>Progress is saved separately for each player, in this browser on this device only.</footer>


<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PKEY='kidsHub.profiles',CKEY='kidsHub.current';
const CUBE_SVG='<svg viewBox="0 0 60 60" aria-hidden="true"><rect x="1" y="1" width="58" height="58" rx="8" fill="#111"/>'+
  ['#ef4444','#3b82f6','#facc15','#22c55e','#ffffff','#f97316','#3b82f6','#ef4444','#22c55e'].map((c,i)=>`<rect x="${5+(i%3)*18}" y="${5+Math.floor(i/3)*18}" width="15" height="15" rx="3" fill="${c}"/>`).join('')+'</svg>';
const DEFAULTS={
  alexia:{name:'Alexia',avatar:'💃',color:'#fbcfe8'},
  ethan:{name:'Ethan',avatar:'cube',color:'#bfdbfe'},
};
const ORDER=['alexia','ethan'];
const GAMES={
  alexia:[{id:'decimals',href:'alexia/decimals/index.html',icon:'🔎',title:'Decimal Zoom',sub:'Tenths, hundredths & number lines',levels:9,isNew:true},
          {id:'addfractions',href:'alexia/adding/index.html',icon:'➕',title:'Fraction Add-venture',sub:'Adding & taking away fractions',levels:8},
          {id:'fractions',href:'alexia/index.html',icon:'🍕',title:'Fraction Quest',sub:'Equivalent fractions',levels:7,legacy:'alexiaFractionQuest.v1'}],
  ethan:[{id:'data',href:'ethan/data/index.html',icon:'📊',title:'Data Dash',sub:'Tallies, picture graphs, column graphs & pie charts',levels:8,isNew:true},
       {id:'numberfacts',href:'ethan/index.html',icon:'🧩',title:'Number Facts Sprint',sub:'Make 10, doubles and more',levels:7,legacy:'ethanNumberFacts.v1'}],
};
const ls={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};

function loadProfiles(){let p={};try{p=JSON.parse(ls.get(PKEY)||'{}')||{};}catch(e){p={};}
  ORDER.forEach(id=>{p[id]=Object.assign({},DEFAULTS[id]);});return p;} /* fixed profiles; overwrites any old stored settings */
let P=loadProfiles();
function saveProfiles(){ls.set(PKEY,JSON.stringify(P));}
saveProfiles(); // games read names from here

/* one-off migration of progress saved before profiles existed */
ORDER.forEach(id=>GAMES[id].forEach(g=>{const k=`kidsHub.p.${id}.${g.id}`;if(g.legacy&&!ls.get(k)&&ls.get(g.legacy))ls.set(k,ls.get(g.legacy));}));

const avatarHTML=(p,cls='avatar')=>`<div class="${cls}" style="background:${p.color}">${p.avatar==='cube'?CUBE_SVG:esc(p.avatar)}</div>`;
function gameStats(id,g){try{const s=JSON.parse(ls.get(`kidsHub.p.${id}.${g.id}`)||'null');if(!s)return null;
  const lv=s.levels||{};const stars=Object.values(lv).reduce((a,l)=>a+(l.stars||0),0);
  const complete=g.levels>0&&Array.from({length:g.levels},(_,i)=>(lv[i+1]||{}).stars||0).every(x=>x>=1);
  return {stars,points:s.points||0,last:s.lastPlayed,best:s.bestStreak||0,complete};}catch(e){return null;}}
function show(id){['picker','kid'].forEach(s=>$('#'+s).classList.toggle('hidden',s!==id));
  $('#switchBtn').classList.toggle('hidden',id!=='kid');window.scrollTo(0,0);}

function renderPicker(){
  $('#profiles').innerHTML=ORDER.map(id=>{const p=P[id];const st=GAMES[id].map(g=>gameStats(id,g)).filter(Boolean);
    const stars=st.reduce((a,s)=>a+s.stars,0);
    return `<button class="prof" data-profile="${id}" style="border-color:${p.color}">${avatarHTML(p)}<span class="nm">${esc(p.name)}</span><span class="sub"><span class="stars">★</span> ${stars} star${stars===1?'':'s'}</span></button>`;}).join('');
  show('picker');
}
function openKid(id){
  ls.set(CKEY,id);const p=P[id];
  $('#kidAvatar').innerHTML=avatarHTML(p);
  $('#kidHello').textContent=`Hi ${p.name}! 👋`;
  document.title=`${p.name}'s Learning Games`;
  $('#games').innerHTML=GAMES[id].map(g=>{const s=gameStats(id,g);
    return `<a class="game${s&&s.complete?' done':''}" href="${g.href}?player=${id}" data-game="${g.id}"><span class="gi">${g.icon}</span><span><div class="gt">${esc(g.title)}</div><div class="gs">${esc(g.sub)}</div>
      <div class="gp">${s&&s.complete?'<span class="badge">✅ Complete!</span> ':''}${!s&&g.isNew?'<span class="badge new">🆕 New game</span> ':''}${s?`<span class="stars">★</span> ${s.stars} / ${g.levels*3} · ⭐ ${s.points} points · 🔥 best ${s.best}`:'Tap to start ➜'}</div></span></a>`;}).join('');
  show('kid');
}
function choose(id){openKid(id);}

const doSwitch=()=>{ls.del(CKEY);renderPicker();};
$('#switchBtn').onclick=doSwitch;$('#switchBtn2').onclick=doSwitch;
$('#profiles').addEventListener('click',e=>{const b=e.target.closest('[data-profile]');if(b)choose(b.dataset.profile);});

/* ---------- start ---------- */
const params=new URLSearchParams(location.search);
if(params.has('switch')){ls.del(CKEY);history.replaceState(null,'',location.pathname);}
const cur=ls.get(CKEY);
if(cur&&P[cur])openKid(cur);else renderPicker();
window.HUB={get P(){return P;},openKid,renderPicker};
})();
</script>
</body>
</html>
